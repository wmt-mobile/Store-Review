<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls = 'sm') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
  const storeIcon = (s, cls = 'xs') => `<svg class="i ${cls}" style="fill:currentColor;stroke:none"><use href="#i-${s === 'apple' ? 'apple' : 'play'}"/></svg>`;
  const LS = { get(k) { try { return localStorage.getItem('rr-' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('rr-' + k, v); } catch {} } };

  let M = null;
  let tz = 'Asia/Kolkata';
  let firstLoad = true;
  let seenIds = new Set((() => { try { return JSON.parse(LS.get('seen') || '[]'); } catch { return []; } })());
  let freshIds = new Set();
  let openKey = null;

  // ── formatting ──
  const dur = (ms) => {
    if (ms == null || ms < 0) return '';
    const m = Math.floor(ms / 60000);
    if (m < 1) return '<1m';
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  };
  const ago = (ts) => (!ts ? 'never' : Date.now() - ts < 60000 ? 'just now' : dur(Date.now() - ts) + ' ago');
  const fmt = (ts) => ts ? new Intl.DateTimeFormat('en-IN', { timeZone: tz, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ts)) : '—';
  const dayKey = (ts) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ts));
  const dayLabel = (ts) => {
    const k = dayKey(ts);
    if (k === dayKey(Date.now())) return 'Today';
    if (k === dayKey(Date.now() - 864e5)) return 'Yesterday';
    return new Intl.DateTimeFormat('en-IN', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'short' }).format(new Date(ts));
  };
  const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const appIcon = (name, url, cls = '') => url
    ? `<span class="ico ${cls}"><img src="${esc(url)}" alt="" loading="lazy"></span>`
    : `<span class="ico ${cls}" style="background:linear-gradient(135deg,hsl(${hue(name)} 62% 56%),hsl(${(hue(name) + 40) % 360} 58% 44%))">${esc((name || '?').trim()[0]?.toUpperCase() || '?')}</span>`;
  const badge = (c, sm = '') => `<span class="badge ${sm}" style="--c:var(--c-${c.category});--b:var(--b-${c.category})">${esc(c.label)}</span>`;
  const chChip = (st, label) => `<span class="chip">${storeIcon(st)}${esc(label)}</span>`;
  const accName = (id) => M.accounts.find((a) => a.id === id)?.name || id;
  const accLabel = (id) => { const a = M.accounts.find((x) => x.id === id); return a ? `${a.name} · ${a.store === 'apple' ? 'Apple' : 'Play'}` : id; };
  const sla = (ms) => {
    const h = (ms || 0) / 36e5, lim = M.stuckHours || 48;
    return { pct: Math.min(100, (h / lim) * 100), cls: h > lim ? 'stuck' : h > lim / 2 ? 'warn' : '', color: h > lim ? 'var(--c-rejected)' : h > lim / 2 ? 'var(--c-action)' : 'var(--c-in_review)' };
  };
  const aiBlock = (ai) => !ai ? '' : `<div class="aisum"><div class="ai-t"><span class="ai-b">${icon('sparkle', 'xs')}AI summary</span>${ai.deadline ? `<span class="ai-d">${icon('clock', 'xs')}${esc(ai.deadline)}</span>` : ''}</div>
    ${ai.title ? `<b class="ai-h">${esc(ai.title)}</b>` : ''}
    ${ai.issues?.length ? `<div class="ai-l">What's wrong</div><ul>${ai.issues.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${ai.fixes?.length ? `<div class="ai-l">How to fix</div><ul class="fix">${ai.fixes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
  const empty = (em, t, s = '') => `<div class="empty"><div class="em">${em}</div><b>${t}</b>${s ? `<div class="small">${s}</div>` : ''}</div>`;

  // ── route + filters live in the hash: #/view?store=&account= ──
  const VIEWS = {
    overview: { t: 'Overview', i: 'grid' },
    review: { t: 'In review', i: 'hourglass' },
    attention: { t: 'Needs attention', i: 'alert' },
    apps: { t: 'All apps', i: 'apps' },
    accounts: { t: 'Accounts', i: 'building' },
    activity: { t: 'Activity', i: 'activity' },
    setup: { t: 'Setup', i: 'settings', admin: true },
    manage: { t: 'Manage apps', i: 'sliders', admin: true },
    audit: { t: 'Audit log', i: 'scroll', admin: true },
  };
  const S = { view: 'overview', store: '', account: '', layout: LS.get('layout') || 'grid', actCat: '', range: [7, 14, 30].includes(Number(LS.get('range'))) ? Number(LS.get('range')) : 7 };
  const qs = () => { const p = new URLSearchParams(); if (S.store) p.set('store', S.store); if (S.account) p.set('account', S.account); return p.toString() ? '?' + p : ''; };
  const readHash = () => {
    const [path, q] = location.hash.replace(/^#\/?/, '').split('?');
    S.view = VIEWS[path] ? path : 'overview';
    const p = new URLSearchParams(q || '');
    S.store = p.get('store') || '';
    S.account = p.get('account') || '';
  };
  const go = (view, extra = {}) => {
    Object.assign(S, extra);
    const h = `#/${view}${qs()}`;
    if (location.hash !== h) location.hash = h; else render();
  };
  addEventListener('hashchange', () => { const prev = S.view; readHash(); render(); if (prev !== S.view) scrollTo({ top: 0 }); });
  const passes = (x) => (!S.store || x.store === S.store) && (!S.account || x.accountId === S.account);

  // ── chrome ──
  function renderNav() {
    const pend = M.pending.filter(passes).length, att = M.attention.filter(passes).length;
    const counts = { review: pend, attention: att, apps: M.apps.filter(passes).length, accounts: M.accounts.length };
    const item = (k) => `<a href="#/${k}${qs()}" class="${S.view === k ? 'on' : ''}">${icon(VIEWS[k].i)}<span>${VIEWS[k].t}</span>${counts[k] != null ? `<span class="ct ${k === 'attention' && att ? 'hot' : ''}">${counts[k]}</span>` : ''}</a>`;
    $('#nav').innerHTML = `<div class="nav-label">Monitor</div>${['overview', 'review', 'attention'].map(item).join('')}<div class="nav-label">Catalog</div>${['apps', 'accounts', 'activity'].map(item).join('')}${M.admin ? `<div class="nav-label">Admin</div>${['setup', 'manage', 'audit'].map(item).join('')}` : ''}`;
    $('#mnav').innerHTML = ['overview', 'review', 'attention', 'apps', M.admin ? 'setup' : 'accounts'].map((k) =>
      `<a href="#/${k}${qs()}" class="${S.view === k ? 'on' : ''}">${icon(VIEWS[k].i, '')}<span>${VIEWS[k].t.replace('Needs attention', 'Attention')}</span>${k === 'attention' && att ? `<span class="ct">${att}</span>` : k === 'review' && pend ? `<span class="ct" style="background:var(--c-in_review)">${pend}</span>` : ''}</a>`).join('');
  }

  function renderTop() {
    $('#title').textContent = VIEWS[S.view].t;
    const adminView = Boolean(VIEWS[S.view].admin);
    $('#storeSeg').style.display = adminView ? 'none' : '';
    $('#accSel').style.display = adminView ? 'none' : '';
    $$('#storeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.store));
    const sel = $('#accSel');
    const opts = '<option value="">All accounts</option>' + M.accounts.filter((a) => !S.store || a.store === S.store)
      .map((a) => `<option value="${esc(a.id)}">${esc(a.name)} · ${a.store === 'apple' ? 'Apple' : 'Play'}</option>`).join('');
    if (sel.dataset.sig !== opts) { sel.innerHTML = opts; sel.dataset.sig = opts; }
    sel.value = S.account;
    const bad = M.accounts.filter((a) => a.error);
    const gmailOff = M.gmail && !M.gmail.enabled && M.accounts.some((a) => a.store === 'google');
    const ban = [];
    if (M.demo) ban.push(`<div class="banner info">${icon('sparkle')}<div class="grow"><b>You're looking at demo data.</b> Add your Apple keys, Play service account and Gmail access, then run <code>npm run check</code>.</div></div>`);
    if (bad.length) ban.push(`<div class="banner err">${icon('alert')}<div class="grow"><b>${bad.length} account${bad.length > 1 ? 's are' : ' is'} failing:</b> ${bad.map((a) => esc(accLabel(a.id))).join(', ')}. Statuses for ${bad.length > 1 ? 'these accounts' : 'this account'} may be out of date.</div><button class="ibtn" data-go="accounts">Fix it</button></div>`);
    if (gmailOff || M.gmail?.error) ban.push(`<div class="banner">${icon('mail')}<div class="grow"><b>Play email reader ${gmailOff ? 'not configured' : 'failing'}.</b> Google Play approvals, rejections and reasons can't be detected yet.</div></div>`);
    $('#banners').innerHTML = ban.join('');
    $('#pulse').classList.toggle('bad', Boolean(bad.length || gmailOff || M.gmail?.error));
    $('#liveTxt').textContent = `Live · synced ${ago(M.generatedAt)}`;
  }

  // ── building blocks ──
  function tcard(r) {
    const s = sla(r.elapsedMs);
    return `<button class="tcard" data-app="${esc(r.appKey)}">
      <div class="row">${appIcon(r.appName, r.iconUrl, 'sm')}<div style="min-width:0;flex:1"><div class="nm">${esc(r.appName)}</div>
      <div class="meta">${storeIcon(r.store)} ${esc(r.channelLabel)} · ${esc(r.version || '—')}</div></div></div>
      <div class="foot">${r.elapsedMs != null
        ? `<div class="sla" style="--k:${s.color}"><i style="width:${s.pct}%"></i></div><span style="color:${s.cls ? s.color : 'var(--text-2)'};font-weight:600">${dur(r.elapsedMs)}</span>`
        : `<span class="lbl" style="--c:var(--c-${r.category})">${esc(r.label)}</span><span style="flex:none">${ago(r.since)}</span>`}</div>
    </button>`;
  }

  function feedItem(e, withReason = false) {
    return `<li data-app="${esc(e.appKey)}"><div class="ev" style="--c:var(--c-${e.category});--b:var(--b-${e.category})">${esc(e.emoji || '•')}</div>
      <div style="min-width:0;flex:1"><div class="t1"><b>${esc(e.appName)}</b> ${esc(e.version)} <span style="color:var(--faint)">→</span> <span style="color:var(--c-${e.category});font-weight:600">${esc(e.label)}</span></div>
      <div class="t2">${storeIcon(e.store)} ${esc(e.channelLabel)} · ${esc(e.accountName)} · ${withReason ? fmt(e.at) : ago(e.at)}</div>
      ${withReason && e.reason ? `<div class="t2" style="color:var(--text-2);white-space:pre-line;display:block;margin-top:4px">${esc(e.reason.slice(0, 240))}</div>` : ''}</div>
      ${freshIds.has(e.id) ? '<span class="new" title="New since your last visit"></span>' : ''}</li>`;
  }

  // ── views ──
  function vOverview() {
    const st = M.stats || {}, md = st.medianReviewMs || {};
    const pend = M.pending.filter(passes), att = M.attention.filter(passes), apps = M.apps.filter(passes);
    const inRev = pend.filter((r) => r.category === 'in_review'), waiting = pend.filter((r) => r.category === 'submitted');
    const approved = [];
    for (const a of apps) for (const c of Object.values(a.channels)) if (c.category === 'approved') approved.push({ appKey: a.key, appName: a.name, iconUrl: a.iconUrl, store: a.store, accountId: a.accountId, ...c });
    const live = apps.filter((a) => { const p = a.channels.appstore || a.channels.production; return p && (p.category === 'live' || p.liveVersion); }).length;
    const stuck = pend.filter((r) => r.stuck).length;
    const acts = M.activity.filter(passes);
    const accs = M.accounts.filter((a) => (!S.store || a.store === S.store) && (!S.account || a.id === S.account));
    const rej = att.filter((r) => r.category === 'rejected').length;

    // ── weekly chart: store updates per day, stacked by outcome ──
    const days = S.range;
    const SER = [
      { k: 'sent', l: 'Sent for review', c: 'var(--orange)', cats: ['submitted'] },
      { k: 'rev', l: 'In review', c: 'var(--yellow)', cats: ['in_review'] },
      { k: 'ok', l: 'Approved / live', c: 'var(--lime)', cats: ['approved', 'live'] },
      { k: 'bad', l: 'Rejected', c: 'var(--red)', cats: ['rejected', 'action', 'removed'] },
    ];
    const buckets = [];
    for (let i = days - 1; i >= 0; i--) { const ts = Date.now() - i * 864e5; buckets.push({ k: dayKey(ts), ts, v: { sent: 0, rev: 0, ok: 0, bad: 0 } }); }
    const byK = Object.fromEntries(buckets.map((b) => [b.k, b]));
    for (const e of acts) { const b = byK[dayKey(e.at)]; const s = SER.find((x) => x.cats.includes(e.category)); if (b && s) b.v[s.k]++; }
    const tot = (b) => b.v.sent + b.v.rev + b.v.ok + b.v.bad;
    const top = Math.ceil(Math.max(4, ...buckets.map(tot)) / 4) * 4;
    const total = buckets.reduce((n, b) => n + tot(b), 0);
    const wd = (ts, short) => new Intl.DateTimeFormat('en-IN', { timeZone: tz, ...(short ? { weekday: 'short' } : { day: 'numeric' }) }).format(new Date(ts));
    const longD = (ts) => new Intl.DateTimeFormat('en-IN', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'short' }).format(new Date(ts));
    const gap = days === 7 ? 14 : days === 14 ? 8 : 4;
    const bars = buckets.map((b, i) => {
      const t = tot(b), today = i === buckets.length - 1;
      return `<div class="cbar ${today ? 'today' : ''}"><span class="ghost"></span>
        ${t ? `<div class="stk" style="height:${(t / top) * 100}%">${SER.filter((s) => b.v[s.k]).map((s) => `<span class="sg hz" style="--k:${s.c};flex:${b.v[s.k]}"></span>`).join('')}</div>` : ''}
        <div class="tip"><div class="d">${longD(b.ts)}</div>${SER.map((s) => `<div style="--k:${s.c}"><i></i>${s.l}<b>${b.v[s.k]}</b></div>`).join('')}</div></div>`;
    }).join('');
    const xl = buckets.map((b, i) => `<span class="${i === buckets.length - 1 ? 'on' : ''}">${days === 7 ? wd(b.ts, true) : days === 14 || i % 3 === 0 || i === buckets.length - 1 ? wd(b.ts) : ''}</span>`).join('');

    // ── side metrics ──
    const met = (view, l, n, d, c) => `<button class="met" data-go="${view}"><div class="l">${l}</div><div class="big" data-count="${n}">${n}</div><div class="d" style="color:${c}">${d}</div></button>`;

    // ── review time limit ──
    const longest = pend.reduce((m, r) => Math.max(m, r.elapsedMs || 0), 0);
    const lim = (M.stuckHours || 48) * 36e5;
    const pct = Math.min(100, (longest / lim) * 100);
    const limC = longest > lim ? 'var(--red)' : longest > lim / 2 ? 'var(--orange)' : 'var(--lime)';

    // ── tip ──
    let tip;
    if (att.length) tip = { t: `Fix ${att[0].appName}`, p: `${att[0].channelLabel} ${att[0].version ? 'v' + att[0].version + ' ' : ''}is “${att[0].label}”. Open the console, fix it and resubmit. The bot posts as soon as it's back in review.`, go: 'attention', b: 'Open' };
    else if (stuck) tip = { t: `${stuck} review${stuck > 1 ? 's' : ''} past ${M.stuckHours}h`, p: 'Longer than usual. On the App Store you can request an expedited review; on Play, check the Publishing overview for blockers.', go: 'review', b: 'See reviews' };
    else if (approved.length) tip = { t: 'Ready to release', p: `${approved[0].appName} is approved and waiting for you. Release it from the console whenever you're ready.`, go: 'apps', b: 'View apps' };
    else tip = { t: 'Get approved faster', p: 'Add review notes and a working demo login before you submit. Missing test accounts are the top reason for rejections.', go: 'activity', b: 'See activity' };

    // ── recent results strip ──
    const results = acts.filter((e) => ['approved', 'live', 'rejected', 'action', 'removed'].includes(e.category)).slice(0, 12).reverse();
    const blocks = results.map((e) => `<i class="hz" style="--k:${['approved', 'live'].includes(e.category) ? 'var(--lime)' : 'var(--red)'}" title="${esc(e.appName)} · ${esc(e.label)}"></i>`).join('') + '<i class="e"></i>'.repeat(12 - results.length);
    const rate = st.approvalRate30;

    // ── store health ──
    const p = apps.length ? live / apps.length : 0;

    // ── in review now ──
    const goals = [...pend].sort((a, b) => (b.elapsedMs || 0) - (a.elapsedMs || 0)).slice(0, 3).map((r) => {
      const s = sla(r.elapsedMs);
      return `<button class="gi" data-app="${esc(r.appKey)}">${appIcon(r.appName, r.iconUrl, 'sm')}<div class="gb"><div class="gt"><span>${esc(r.appName)}</span><span>${r.elapsedMs != null ? dur(r.elapsedMs) : esc(r.label)} / ${M.stuckHours}h</span></div>
        <div class="tr"><i class="hz" style="width:${Math.max(4, s.pct)}%;--k:${s.cls === 'stuck' ? 'var(--red)' : s.cls ? 'var(--orange)' : 'var(--lime)'};background-color:var(--k)"></i></div><div class="gs">${esc(r.channelLabel)} · ${esc(r.version || '—')} · ${esc(r.label)}</div></div></button>`;
    }).join('');

    // ── accounts wallet ──
    const sel = accs.find((a) => a.id === S.account) || accs[0];
    const wallet = [sel, ...accs.filter((a) => a !== sel)].filter(Boolean).map((a, i) => `<button class="wcard ${i === 0 ? 'main hz' : ''} ${a.error ? 'err' : ''}" data-filter-acc="${esc(a.id)}">
      <div class="wt">${a.store === 'apple' ? 'App Store Connect' : 'Google Play Console'}${storeIcon(a.store, '')}</div>
      <span class="chipx"></span>
      <div class="wn">${a.appCount}<small>apps</small></div>
      <div class="wb"><span>${esc(a.name)}</span><span>${a.error ? 'failing' : 'synced ' + ago(a.lastPollAt)}</span></div></button>`).join('');
    const qa = (ic, l, attr, n = 0) => `<button ${attr}><span class="qi">${icon(ic)}${n ? `<b>${n}</b>` : ''}</span>${l}</button>`;
    const qpApps = [];
    const seen = new Set();
    for (const r of pend.length ? pend : acts) { if (seen.has(r.appKey)) continue; seen.add(r.appKey); qpApps.push(r); if (qpApps.length >= 6) break; }

    // ── recent activity ──
    const tx = acts.slice(0, 7).map((e) => `<li data-app="${esc(e.appKey)}">${appIcon(e.appName, e.iconUrl)}<div class="b"><div class="n">${esc(e.appName)}${freshIds.has(e.id) ? '<span class="nw" title="New since your last visit"></span>' : ''}</div><div class="d">${storeIcon(e.store)} ${fmt(e.at)}</div></div>
      <div class="r"><b style="color:var(--c-${e.category})">${esc(e.label)}</b><span>${esc(e.version || e.channelLabel)}</span></div></li>`).join('');

    return `<div class="bento">
      <div class="bmain">
        <div class="bx hero">
          <div class="bx-h"><div><div class="big" data-count="${total}">${total}</div><div class="s">Store updates · last ${days} days</div></div><div class="grow"></div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px"><div class="rng">${[7, 14, 30].map((d) => `<button data-range="${d}" class="${d === days ? 'on' : ''}">${d}d</button>`).join('')}</div>
            <div class="lgd">${SER.map((s) => `<span style="--k:${s.c}"><i></i>${s.l}</span>`).join('')}</div></div></div>
          <div class="chart"><div class="yax">${[top, top * 0.75, top / 2, top / 4, 0].map((n) => `<span>${Math.round(n)}</span>`).join('')}</div>
            <div class="plot"><div class="grid-l">${'<i></i>'.repeat(5)}</div><div class="bars" style="--gap:${gap}px">${bars}</div><div class="xax" style="--gap:${gap}px">${xl}</div></div></div>
        </div>
        <div class="bx mcol">
          ${met('review', 'Under review', pend.length, `${inRev.length} in review · ${waiting.length} waiting`, stuck ? 'var(--c-rejected)' : 'var(--c-in_review)')}
          ${met('attention', 'Needs attention', att.length, att.length ? `${rej} rejected · ${att.length - rej} other` : 'No rejections 🎉', att.length ? 'var(--c-rejected)' : 'var(--c-live)')}
          ${met('apps', 'Live in store', live, `of ${apps.length} apps · ${approved.length} ready to release`, 'var(--c-live)')}
        </div>

        <div class="bx half">
          <div class="bx-h"><div><h3>Review time limit</h3><div class="s">Longest wait vs the ${M.stuckHours}h stuck limit</div></div><div class="grow"></div>${M.admin ? `<button class="ibtn sq round" data-go="setup" title="Change the limit">${icon('pencil')}</button>` : ''}</div>
          <div class="meter"><i class="hz" style="width:${pend.length ? Math.max(3, pct) : 0}%;--k:${limC}"></i></div>
          <div class="meter-l"><span>${pend.length ? dur(longest) + ' longest wait' : 'Nothing waiting'}</span><span>${M.stuckHours}h</span></div>
        </div>
        <div class="bx half tipcard">
          <div class="tx"><div class="bx-h"><h3>${esc(tip.t)}</h3></div><p>${esc(tip.p)}</p><button class="more-l" data-go="${tip.go}">${esc(tip.b)} ${icon('chev', 'xs')}</button></div>
          <div class="stairs">${['o', 'o', 'o', 'l', 'o', 'o', 'l', '', 'o', 'l', '', '', 'l', '', '', ''].map((c) => `<i class="${c} ${c ? '' : 'hz'}"></i>`).join('')}</div>
        </div>

        <div class="bx third">
          <div class="bx-h"><div><h3>Review results</h3><div class="s">Approval rate · 30 days</div></div></div>
          <div class="big md" style="margin-top:12px">${rate == null ? '—' : Math.round(rate * 100) + '%'}</div>
          <div class="s" style="font-size:12px;color:var(--muted);font-weight:600">${st.approved30 ?? 0} approved · ${st.rejected30 ?? 0} rejected</div>
          <div class="blocks">${blocks}</div>
          <div class="lgd" style="margin-top:10px"><span style="--k:var(--lime)"><i></i>Approved</span><span style="--k:var(--red)"><i></i>Rejected</span><span style="color:var(--faint)">last 12</span></div>
        </div>
        <div class="bx third">
          <div class="bx-h"><div><h3>Store health</h3><div class="s">Apps live in the store</div></div></div>
          <div class="gauge"><div class="arc hz" style="--p:${p}"></div><div class="hole"></div><div class="gv">${Math.round(p * 100)}%</div></div>
          <div style="text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-top:6px">${live} of ${apps.length} apps · median review ${md.appstore ? dur(md.appstore) : '—'} iOS · ${md.play ? dur(md.play) : '—'} Play</div>
        </div>
        <div class="bx third">
          <div class="bx-h"><div><h3>In review now</h3><div class="s">Longest waits first</div></div><div class="grow"></div><button class="pill" data-go="review">View all</button></div>
          ${goals ? `<div class="goal">${goals}</div>` : `<div class="small" style="padding:26px 0;text-align:center">Nothing in review 🎉</div>`}
        </div>
      </div>

      <div class="bside">
        <div class="bx">
          <div class="bx-h"><div><h3>Accounts</h3><div class="s">Developer teams</div></div><div class="grow"></div>${M.admin ? `<button class="pill" data-go="setup">${icon('plus', 'xs')}Add account</button>` : `<button class="pill" data-go="accounts">View all</button>`}</div>
          ${wallet ? `<div class="wallet">${wallet}</div>` : `<div class="small" style="padding:18px 0">No accounts yet.</div>`}
          <div class="qa">
            ${qa('refresh', 'Refresh', 'data-refresh')}
            ${qa('hourglass', 'In review', 'data-go="review"', pend.length)}
            ${qa('alert', 'Attention', 'data-go="attention"', att.length)}
            ${qa('activity', 'Activity', 'data-go="activity"')}
            ${qa(M.admin ? 'settings' : 'building', M.admin ? 'Setup' : 'Accounts', `data-go="${M.admin ? 'setup' : 'accounts'}"`)}
          </div>
          <div class="qp-h">${pend.length ? 'Apps in review' : 'Recently updated'}<span>${qpApps.length ? 'tap to open' : ''}</span></div>
          <div class="qp">${qpApps.length ? qpApps.map((r) => `<button data-app="${esc(r.appKey)}">${appIcon(r.appName, r.iconUrl)}<span>${esc(r.appName.split(/[\s-]/)[0])}</span></button>`).join('') : '<div class="none">Nothing yet</div>'}</div>
        </div>
        <div class="bx">
          <div class="bx-h"><div><h3>Recent activity</h3></div><div class="grow"></div><button class="pill" data-go="activity">See all</button></div>
          ${tx ? `<div class="tx-head" style="margin-top:8px"><span>App</span><span>Status</span></div><ul class="tx-list" style="margin-top:0">${tx}</ul>` : `<div class="small" style="padding:22px 0;text-align:center">No changes yet</div>`}
        </div>
      </div>
    </div>`;
  }

  function vReview() {
    const rows = M.pending.filter(passes);
    if (!rows.length) return `<div class="card">${empty('🎉', 'Nothing under review', 'When you submit a build or release, it appears here with a live timer.')}</div>`;
    return `<div class="card list">
      <div class="lrow head"><div>App</div><div>Store · track</div><div>Status</div><div>Time in review · SLA ${M.stuckHours}h</div><div></div></div>
      ${rows.map((r) => { const s = sla(r.elapsedMs); return `<div class="lrow" data-app="${esc(r.appKey)}">
        <div class="appc">${appIcon(r.appName, r.iconUrl)}<div style="min-width:0"><div class="nm">${esc(r.appName)} <span class="small" style="font-weight:500">${esc(r.version || '')}</span></div><div class="sb">${esc(accLabel(r.accountId))}</div></div></div>
        <div>${chChip(r.store, r.channelLabel)}${r.liveVersion ? `<div class="tiny" style="margin-top:4px">live: ${esc(r.liveVersion)}</div>` : ''}</div>
        <div>${badge(r)}<div class="tiny" style="margin-top:4px">since ${ago(r.since)}</div></div>
        <div class="timer ${s.cls}"><div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="v">${dur(r.elapsedMs)}${r.stuck ? ' ⏰' : ''}</span><span class="tiny">submitted ${fmt(r.submittedAt)}</span></div><div class="sla" style="--k:${s.color}"><i style="width:${s.pct}%"></i></div></div>
        <div class="acts">${r.url ? `<a class="ibtn sq" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open console">${icon('ext')}</a>` : ''}</div>
      </div>`; }).join('')}</div>`;
  }

  function vAttention() {
    const rows = M.attention.filter(passes);
    if (!rows.length) return `<div class="card">${empty('✅', 'No rejections or policy actions', 'Everything submitted is in review, approved or live.')}</div>`;
    return `<div class="alerts">${rows.map((r, i) => `<div class="card alert" style="--c:var(--c-${r.category})">
      <div style="display:flex;gap:12px;align-items:center">${appIcon(r.appName, r.iconUrl)}<div style="min-width:0;flex:1"><div style="font-weight:650">${esc(r.appName)} <span class="small">${esc(r.version || '')}</span></div>
        <div class="small" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px">${chChip(r.store, r.channelLabel)} ${esc(accLabel(r.accountId))}</div></div>${badge(r)}</div>
      ${aiBlock(r.ai)}
      <div class="reason ${r.reason ? '' : 'muted'}" ${r.ai ? 'hidden' : ''}>${esc(r.reason || (r.store === 'apple' ? "Apple doesn't share the reviewer's message through its API. Open App Store Connect → App Review to read it and reply." : r.status === 'HALTED' ? 'The staged rollout was halted in Play Console. Resume or replace the release there.' : 'No reason text yet. It arrives with the Play Console email.'))}</div>
      <div class="bar">
        ${r.url ? `<a class="ibtn primary" href="${esc(r.url)}" target="_blank" rel="noopener">${icon('ext')}${r.store === 'apple' ? 'App Store Connect' : 'Play Console'}</a>` : ''}
        ${r.messageId ? `<button class="ibtn" data-email="${esc(r.messageId)}">${icon('mail')}View email</button>` : r.emailUrl ? `<a class="ibtn" href="${esc(r.emailUrl)}" target="_blank" rel="noopener">${icon('mail')}Email</a>` : ''}
        ${r.reason ? `<button class="ibtn" data-copy="${i}">${icon('copy')}Copy</button>` : ''}
        <button class="ibtn" data-app="${esc(r.appKey)}">${icon('clock')}History</button>
        <span class="tiny" style="margin-left:auto">${ago(r.since)}</span>
      </div></div>`).join('')}</div>`;
  }

  const COLS = { apple: ['appstore'], google: ['production'] };
  const COLN = { appstore: 'App Store', testflight: 'TestFlight', production: 'Production', beta: 'Open testing', alpha: 'Closed testing', internal: 'Internal' };

  function vApps() {
    const apps = M.apps.filter(passes);
    const groups = M.accounts.filter((a) => (!S.store || a.store === S.store) && (!S.account || a.id === S.account)).map((acc) => ({ acc, apps: apps.filter((a) => a.accountId === acc.id) }));
    const head = `<div class="chips"><span class="small">${apps.length} apps across ${groups.length} account${groups.length === 1 ? '' : 's'}</span><div style="flex:1"></div>
      <div class="seg"><button data-l="grid" class="${S.layout === 'grid' ? 'on' : ''}">${icon('apps', 'xs')}Cards</button><button data-l="table" class="${S.layout === 'table' ? 'on' : ''}">${icon('list', 'xs')}Table</button></div></div>`;
    if (!groups.length) return head + `<div class="card">${empty('📭', 'No accounts', 'Add accounts in config/apps.json.')}</div>`;
    return head + `<div class="groups">${groups.map(({ acc, apps: list }) => {
      const cols = COLS[acc.store];
      const body = !list.length
        ? `<div class="card">${empty(acc.error ? '⚠️' : '📭', acc.error ? 'Account not reachable' : 'No apps yet', esc(acc.error || 'Apps appear after the next discovery run.'))}</div>`
        : S.layout === 'table'
        ? `<div class="card scrollx"><table class="t"><thead><tr><th>App</th>${cols.map((c) => `<th>${esc(COLN[c] || c)}</th>`).join('')}</tr></thead><tbody>
          ${list.map((a) => `<tr data-app="${esc(a.key)}"><td><div class="appc">${appIcon(a.name, a.iconUrl, 'sm')}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sb">${esc(a.bundleOrPackage)}</div></div></div></td>
            ${cols.map((c) => { const ch = a.channels[c]; return `<td>${ch ? `${badge(ch, 'sm')}<div class="cellv">${esc(ch.version)} · ${ago(ch.since)}${ch.elapsedMs != null ? ` · <b style="color:${sla(ch.elapsedMs).color}">${dur(ch.elapsedMs)}</b>` : ''}</div>` : '<span class="tiny">—</span>'}</td>`; }).join('')}</tr>`).join('')}
          </tbody></table></div>`
        : `<div class="grid">${list.map((a) => `<button class="card acard" data-app="${esc(a.key)}"><span class="stripe" style="--k:var(--c-${a.topCategory})"></span>
            <div class="appc">${appIcon(a.name, a.iconUrl)}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sb">${esc(a.bundleOrPackage)}</div></div></div>
            <div class="chs">${cols.filter((c) => a.channels[c] || COLS[acc.store].includes(c)).map((c) => { const ch = a.channels[c]; return ch
              ? `<div class="chl"><span class="lb">${esc(COLN[c] || c)}</span>${badge(ch, 'sm')}<span class="vv" title="${esc(ch.version)}">${ch.elapsedMs != null ? `<b style="color:${sla(ch.elapsedMs).color}">${dur(ch.elapsedMs)}</b>` : esc(ch.version)}</span></div>`
              : `<div class="chl nosub"><span class="lb">${esc(COLN[c] || c)}</span><span class="tiny">No submission</span></div>`; }).join('')}</div>
          </button>`).join('')}</div>`;
      return `<section><div class="gh"><span class="sic">${storeIcon(acc.store, 'sm')}</span><div><b>${esc(acc.name)}</b><div class="tiny">${acc.store === 'apple' ? 'App Store Connect' : 'Google Play Console'} · ${list.length} apps · synced ${ago(acc.lastPollAt)}</div></div><div class="grow"></div>${acc.error ? '<span class="badge sm" style="--c:var(--c-rejected);--b:var(--b-rejected)">Failing</span>' : ''}</div>${body}</section>`;
    }).join('')}</div>`;
  }

  function vAccounts() {
    const accs = M.accounts.filter((a) => !S.store || a.store === S.store);
    const hint = (a) => {
      const e = a.error || '';
      if (/401|unauthor|expired|NOT_AUTHORIZED/i.test(e)) return a.store === 'apple' ? 'The API key was revoked or is wrong. Create a new Team Key in App Store Connect → Users and Access → Integrations and update keyId / issuerId / .p8.' : 'The service-account key is invalid. Create a new JSON key in Google Cloud and replace the file in keys/.';
      if (/403|permission/i.test(e)) return a.store === 'apple' ? 'The key role is too low. Use App Manager, or Admin if you register webhooks.' : 'Invite the service-account email in this Play account (Users and permissions) with “View app information”.';
      if (/ENOENT|no such file/i.test(e)) return 'The key file path in config/apps.json does not exist on the server.';
      return 'Run `npm run check` on the server for full details.';
    };
    const healthBadge = (bad, warn, offTxt) => bad ? '<span class="badge sm" style="--c:var(--c-rejected);--b:var(--b-rejected)">Failing</span>'
      : warn ? `<span class="badge sm" style="--c:var(--c-action);--b:var(--b-action)">${offTxt || 'Warning'}</span>` : '<span class="badge sm" style="--c:var(--c-live);--b:var(--b-live)">Healthy</span>';
    const gm = M.gmail;
    return `<div class="accgrid">${accs.map((a) => {
      const n = M.apps.filter((x) => x.accountId === a.id).length;
      const pend = M.pending.filter((r) => r.accountId === a.id).length;
      const att = M.attention.filter((r) => r.accountId === a.id).length;
      return `<div class="card acc"><div class="top"><span class="sic">${storeIcon(a.store, '')}</span><div style="min-width:0;flex:1"><div class="nm">${esc(a.name)}</div><div class="small">${a.store === 'apple' ? 'App Store Connect team' : 'Play developer account'} · <code>${esc(a.id)}</code></div></div>${healthBadge(a.error, a.warning)}</div>
        <div class="kv"><div><b>${n}</b><span>apps</span></div><div><b style="color:${pend ? 'var(--c-in_review)' : 'inherit'}">${pend}</b><span>in review</span></div><div><b style="color:${att ? 'var(--c-rejected)' : 'inherit'}">${att}</b><span>attention</span></div></div>
        ${a.error ? `<div class="err"><b>${esc(a.error)}</b><div class="hint">${esc(hint(a))}</div></div>` : ''}
        ${a.warning ? `<div class="err warn">${esc(a.warning)}<div class="hint">Falling back to the apps listed in apps.json. Enable the Play Developer Reporting API for full auto-discovery.</div></div>` : ''}
        <div class="ok">${icon('clock', 'xs')} Synced ${ago(a.lastPollAt)} · apps discovered ${ago(a.lastDiscoveryAt)}</div>
        <button class="ibtn" data-filter-acc="${esc(a.id)}">${icon('apps')}View ${n} apps</button>
      </div>`; }).join('')}

  function vAudit() {

    if (!A.audit) return head + skel(1, 380);
    if (!A.audit.length) return head + `<div class="card">${empty('📜', 'Nothing logged yet', 'Account changes, Chat messages and sync errors appear here.')}</div>`;
    const LABEL = {
      'account.added': '🔌 Account connected', 'account.verify_failed': '⚠️ Account verification failed', 'account.removed': '🗑️ Account removed', 'account.updated': '✏️ Account updated',
      'apps.discovered': '🔎 Apps fetched', 'app.updated': '⚙️ App settings changed', 'apps.bulk_updated': '⚙️ Apps updated in bulk',
      'chat.webhook_set': '💬 Chat webhook saved', 'chat.app_set': '🤖 Chat app connected', 'chat.user_connected': '💬 Signed in to Google Chat', 'chat.user_connect_failed': '❌ Google Chat sign-in failed', 'chat.user_space_set': '💬 Chat space selected (post as me)', 'chat.test_sent': '👋 Test message sent', 'chat.test_failed': '❌ Test message failed', 'chat.notified': '📣 Posted to Chat', 'chat.store_message': '📩 Play message forwarded to Chat', 'chat.digest_sent': '📊 Daily summary posted',
      'prefs.updated': '🎛️ Preferences changed', 'auth.login': '🔐 Signed in', 'auth.logout': '👋 Signed out', 'auth.login_failed': '🚫 Failed sign-in attempt', 'gmail.client_saved': '🔑 Gmail OAuth client saved', 'gmail.connected': '📬 Gmail connected', 'gmail.connect_failed': '❌ Gmail connection failed', 'gmail.disconnected': '📭 Gmail disconnected', 'gmail.query_updated': '🔎 Gmail search changed', 'onboarding.completed': '🎉 Onboarding completed', 'poll.manual': '↻ Manual sync', 'poll.error': '⛔ Sync error',
    };
    let last = '', out = head + '<div class="card" style="padding:8px">';

      const fmtV = (v) => { const t = Array.isArray(v) ? v.map((x) => (x && x.label ? `${x.label}${x.detail ? ' — ' + x.detail : ''}` : typeof x === 'object' ? JSON.stringify(x) : x)).join('; ') : v && typeof v === 'object' ? JSON.stringify(v) : String(v); return t.length > 240 ? t.slice(0, 240) + '…' : t; };

        <span class="actor">${esc(e.actor)}</span></li>`;
    }
    return out + '</ul></div>';
  }

      return it(`${appIcon(a.name, a.iconUrl, 'sm')}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sb">${storeIcon(a.store)} ${esc(a.bundleOrPackage)} · ${esc(accName(a.accountId))}</div></div><span class="rt">${top ? badge(top, 'sm') : ''}</span>`);
    }).join('');
    if (views.length) html += '<div class="pal-sec">Go to</div>' + views.map((x) => it(`<span class="ico sm plain">${icon(x.v.i, 'xs')}</span><div class="nm">${x.v.t}</div>`)).join('');
    if (acts.length) html += '<div class="pal-sec">Actions</div>' + acts.map((x) => it(`<span class="ico sm plain">${icon(x.i, 'xs')}</span><div class="nm">${x.t}</div>`)).join('');
    $('#palList').innerHTML = html || '<div class="empty" style="padding:28px"><b>No matches</b></div>';
    $('.pal-it.on')?.scrollIntoView({ block: 'nearest' });
  }
  const openPal = () => { $('#pal').classList.add('on'); $('#palIn').value = ''; palIdx = 0; palRender(); setTimeout(() => $('#palIn').focus(), 10); };
  const closePal = () => $('#pal').classList.remove('on');
  function palPick(idx) {
    const x = palItems[idx]; if (!x) return;
    closePal();
    if (x.kind === 'app') openApp(x.a.key);
    else if (x.kind === 'view') go(x.k);
    else if (x.id === 'refresh') refresh();
    else toggleTheme();
  }
  $('#openPal').onclick = openPal;
  $('#palIn').addEventListener('input', () => { palIdx = 0; palRender(); });
  $('#palIn').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { palIdx = Math.min(palItems.length - 1, palIdx + 1); palRender(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { palIdx = Math.max(0, palIdx - 1); palRender(); e.preventDefault(); }
    else if (e.key === 'Enter') palPick(palIdx);
  });
  $('#palList').addEventListener('click', (e) => { const it = e.target.closest('.pal-it'); if (it) palPick(Number(it.dataset.idx)); });
  $('#pal').addEventListener('click', (e) => { if (e.target.id === 'pal') closePal(); });

  // ── email viewer ──
  async function openEmail(id) {
    const m = $('#mailm');
    m.classList.add('on'); m.setAttribute('aria-hidden', 'false');
    $('#mailSub').textContent = 'Loading…'; $('#mailFrom').textContent = ''; $('#mailOpen').hidden = true;
    $('#mailFrame').srcdoc = '';
    try {
      const r = await fetch('/api/email/' + encodeURIComponent(id), { credentials: 'same-origin' });
      const e = await r.json();
      if (!r.ok) throw new Error(e.error || r.status);
      $('#mailSub').textContent = e.subject || '(no subject)';
      $('#mailFrom').textContent = `${e.from || ''}${e.at ? ' · ' + fmt(e.at) : ''}`;
      const row = [...M.attention, ...M.apps.flatMap((a) => Object.values(a.channels))].find((x) => x.messageId === id);
      if (row?.emailUrl) { $('#mailOpen').href = row.emailUrl; $('#mailOpen').hidden = false; }
      const body = e.html || `<pre style="white-space:pre-wrap;font:14px/1.6 system-ui,sans-serif">${esc(e.text || '')}</pre>`;
      $('#mailFrame').srcdoc = `<!doctype html><meta charset="utf-8"><base target="_blank"><style>body{margin:0;padding:20px;background:#fff;color:#202124;font:14px/1.6 Roboto,Arial,sans-serif;word-break:break-word}img{max-width:100%;height:auto}</style>${body}`;
    } catch (err) {
      $('#mailSub').textContent = "Couldn't load the email";
      $('#mailFrom').textContent = String(err.message || err);
    }
  }
  function closeEmail() { const m = $('#mailm'); m.classList.remove('on'); m.setAttribute('aria-hidden', 'true'); $('#mailFrame').srcdoc = ''; }
  $('#mailClose').onclick = closeEmail;
  $('#mailm').addEventListener('click', (e) => { if (e.target.id === 'mailm') closeEmail(); });

  // ── toasts + desktop alerts ──
  function toast(html, ms = 4200) {
    const el = document.createElement('div');
    el.className = 'toast'; el.innerHTML = html;
    $('#toasts').append(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
  }
  const notifOn = () => LS.get('notif') === '1' && 'Notification' in window && Notification.permission === 'granted';
  const paintNotif = () => $('#notif').classList.toggle('on', notifOn());
  $('#notif').onclick = async () => {
    if (!('Notification' in window)) return toast('This browser does not support desktop notifications.');
    if (notifOn()) { LS.set('notif', '0'); paintNotif(); return toast('🔕 Desktop alerts off'); }
    const p = await Notification.requestPermission();
    LS.set('notif', p === 'granted' ? '1' : '0'); paintNotif();
    toast(p === 'granted' ? '🔔 Desktop alerts on. You’ll be notified while this tab is open.' : 'Notifications are blocked in your browser settings.');
  };

  // ── theme ──
  const curTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function toggleTheme() { const t = curTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; LS.set('theme', t); }
  if (LS.get('theme')) document.documentElement.dataset.theme = LS.get('theme');
  $('#theme').onclick = toggleTheme;

  // ── global events ──
  $('#storeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(S.view, { store: b.dataset.v, account: '' }); });
  $('#accSel').addEventListener('change', (e) => go(S.view, { account: e.target.value }));
  document.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.closest('a[href^="http"]')) return; // external links just open
    const c = t.closest('[data-copy]');
    if (c) { const r = M.attention.filter(passes)[Number(c.dataset.copy)]; try { await navigator.clipboard.writeText(r?.reason || ''); toast('📋 Reason copied'); } catch { toast('Copy failed'); } return; }
    const ct = t.closest('[data-copytext]');
    if (ct) { try { await navigator.clipboard.writeText(ct.dataset.copytext); toast('📋 Copied'); } catch { toast('Copy failed'); } return; }
    const em = t.closest('[data-email]'); if (em) return openEmail(em.dataset.email);
    if (t.closest('#drClose')) return closeDrawer();
    const rg = t.closest('[data-range]'); if (rg) { S.range = Number(rg.dataset.range); LS.set('range', S.range); return render(); }
    if (t.closest('[data-refresh]')) return refresh();
    const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
    const l = t.closest('[data-l]'); if (l) { S.layout = l.dataset.l; LS.set('layout', S.layout); return render(); }
    const ac = t.closest('[data-act]'); if (ac) { S.actCat = ac.dataset.act; return render(); }
    const fa = t.closest('[data-filter-acc]'); if (fa) { const a = M.accounts.find((x) => x.id === fa.dataset.filterAcc); return go('apps', { account: a.id, store: a.store }); }
    const ap = t.closest('[data-app]'); if (ap) return openApp(ap.dataset.app);
  });
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('#pal').classList.contains('on') ? closePal() : openPal(); }
    if (e.key === 'Escape') { if ($('#mailm').classList.contains('on')) return closeEmail(); closePal(); closeDrawer(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); openPal(); }
    else if (e.key === 'r') refresh();
    else if (e.key === 't') toggleTheme();
    else if (/^[1-6]$/.test(e.key)) go(Object.keys(VIEWS)[Number(e.key) - 1]);
  });

  // ── render + data ──
  function countUp() {
    $$('[data-count]').forEach((el) => {
      const to = Number(el.dataset.count); if (!to) return;
      const t0 = performance.now();
      const step = (t) => { const p = Math.min(1, (t - t0) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  function render() {
    if (!M) return;
    renderNav(); renderTop();
    if (VIEWS[S.view].admin && !M.admin) S.view = 'overview';
    $('#view').innerHTML = { overview: vOverview, review: vReview, attention: vAttention, apps: vApps, accounts: vAccounts, activity: vActivity, setup: vSetup, manage: vManage, audit: vAudit }[S.view]();
    if (VIEWS[S.view].admin) adminLoad(S.view);
    const att = M.attention.length;
    document.title = (att ? `(${att}) ` : '') + `${VIEWS[S.view].t} · Review Radar`;
  }
  function skeleton() {
    $('#view').innerHTML = `<div class="bento"><div class="bmain"><div class="sk hero" style="height:330px;border-radius:20px"></div><div class="sk mcol" style="height:330px;border-radius:20px"></div><div class="sk half" style="height:140px;border-radius:20px"></div><div class="sk half" style="height:140px;border-radius:20px"></div>${'<div class="sk third" style="height:220px;border-radius:20px"></div>'.repeat(3)}</div><div class="bside"><div class="sk" style="height:420px;border-radius:20px"></div><div class="sk" style="height:360px;border-radius:20px"></div></div></div>`;
  }
  async function load({ manual = false } = {}) {
    try {
      const res = await fetch('/api/dashboard', { credentials: 'same-origin', cache: 'no-store' });
      if (res.status === 401) return location.reload();
      const next = await res.json();
      tz = next.tz || tz;
      const ids = next.activity.map((e) => e.id);
      if (firstLoad) {
        if (seenIds.size) freshIds = new Set(ids.filter((id) => !seenIds.has(id)));
      } else {
        const prev = new Set(M.activity.map((e) => e.id));
        const added = next.activity.filter((e) => !prev.has(e.id));
        added.forEach((e) => freshIds.add(e.id));
        if (added.length) {
          const e = added[0];
          toast(`<span style="font-size:20px">${esc(e.emoji)}</span><div><b>${esc(e.appName)} ${esc(e.version)}</b><div class="small">${esc(e.channelLabel)} → ${esc(e.label)}${added.length > 1 ? ` · +${added.length - 1} more` : ''}</div></div>`, 7000);
          if (notifOn()) added.slice(0, 3).forEach((x) => { try { new Notification(`${x.emoji} ${x.appName} ${x.version}`, { body: `${x.channelLabel}: ${x.label}\n${x.accountName}`, tag: x.id }); } catch {} });
        } else if (manual) toast('✅ Up to date. No new changes.');
      }
      seenIds = new Set(ids); LS.set('seen', JSON.stringify(ids.slice(0, 200)));
      M = next;
      if (M.user && $('#me').hidden) { $('#me').hidden = false; $('#meEmail').textContent = M.user; $('#meav').textContent = M.user[0].toUpperCase(); }
      render();
      if (firstLoad) { firstLoad = false; if (S.view === 'overview') countUp(); }
    } catch (err) {
      console.error(err);
      $('#liveTxt').textContent = 'Offline · retrying…';
      $('#pulse').classList.add('bad');
      if (firstLoad) $('#view').innerHTML = `<div class="card">${empty('📡', "Can't reach the server", 'Retrying every 30 seconds.')}</div>`;
    }
  }
  async function refresh() {
    const b = $('#refresh'); if (b.disabled) return;
    b.disabled = true; b.classList.add('spin');
    toast('↻ Polling Apple and Google for every account…', 2500);
    await fetch('/api/refresh', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
    setTimeout(async () => { await load({ manual: true }); b.disabled = false; b.classList.remove('spin'); }, 5000);
  }
  $('#refresh').onclick = refresh;
  $('#logout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {}); location.href = '/login'; };

  (() => {
    const m = location.hash.match(/[?&](gmail|chat)=([^&]+)/);
    if (!m) return;
    const v = decodeURIComponent(m[2]);
    const okMsg = m[1] === 'chat' ? '💬 Signed in to Google Chat — now click Find my spaces' : '📬 Gmail connected — the bot will read Play emails from now on';
    setTimeout(() => toast(v === 'ok-sent' ? '✅ Connected — app_review_bot just posted a hello in your space' : v === 'ok' ? okMsg : `⚠️ ${m[1] === 'chat' ? 'Google Chat' : 'Gmail'}: ` + esc(v.replace(/^error:/, '')), 7000), 600);
    if (m[1] === 'chat') A.chatMode = 'user';
    history.replaceState(null, '', '#/setup');
  })();
  readHash();
  paintNotif();
  skeleton();
  load();
  setInterval(() => load(), 30000);
  setInterval(() => { if (M && !$('#drawer').classList.contains('on') && !$('#pal').classList.contains('on') && !document.hidden) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>

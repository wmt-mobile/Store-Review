        A.chatMsg = { ok: true, text: `Connected — a test message was posted to ${sp?.displayName || A.spaceSel}.` };
      } catch (err) { A.chatMsg = { ok: false, text: err.message }; }
      return adminLoad('setup', true);
    }
    if ((el = q('[data-chatmode]'))) { A.chatMode = el.dataset.chatmode; A.chatMsg = null; A.spaces = null; A.spaceSel = null; A.spacesErr = null; $('#view').innerHTML = vSetup(); return; }
    if (q('[data-c-spaces]')) {
      A.chatSa = $('#c-sa').value; A.spacesLoading = true; A.spacesErr = null; $('#view').innerHTML = vSetup();
      try { const r = await fetch(`/api/admin/settings/chat/spaces?accountId=${encodeURIComponent(A.chatSa)}`, { credentials: 'same-origin' }); const j = await r.json(); if (!r.ok) A.spacesErr = j; else { A.spaces = j.spaces; A.spacesMode = 'app'; if (j.spaces.length === 1) A.spaceSel = j.spaces[0].name; } }
      catch (err) { A.spacesErr = { error: err.message }; }
      A.spacesLoading = false; $('#view').innerHTML = vSetup(); return;
    }
    if ((el = q('.space'))) { e.preventDefault(); A.spaceSel = el.querySelector('input').value; $('#view').innerHTML = vSetup(); return; }
    if (q('[data-c-save]')) {
      const sp = A.spaces?.find((x) => x.name === A.spaceSel);
      try {
        await aApi('/settings/chat', { method: 'PUT', body: { mode: 'app', accountId: $('#c-sa').value, space: A.spaceSel, spaceName: sp?.displayName } });
        await aApi('/settings/chat/test', { method: 'POST', body: {} });
        A.chatMsg = { ok: true, text: `Connected — app_review_bot just said hello in ${sp?.displayName || A.spaceSel}.` };
      } catch (err) { A.chatMsg = { ok: false, text: err.message }; }
      return adminLoad('setup', true);
    }
    if (q('[data-a-chatsave]') || q('[data-a-chattest]')) {
      const url = $('#a-chat')?.value.trim() || '';
      try {
        if (url) await aApi('/settings/chat', { method: 'PUT', body: { webhookUrl: url } });
        else if (q('[data-a-chatsave]')) return toast('Paste a webhook URL first');
        if (q('[data-a-chattest]')) await aApi('/settings/chat/test', { method: 'POST', body: {} });
        A.chatMsg = { ok: true, text: q('[data-a-chattest]') ? 'Test message sent — check the Chat space.' : 'Webhook saved.' };
      } catch (err) { A.chatMsg = { ok: false, text: err.message }; }
      return adminLoad('setup', true);
    }
    if ((el = q('[data-a-toggle]'))) {
      const k = el.dataset.aToggle; const cur = A.setup.prefs[k] !== false;
      A.setup.prefs[k] = !cur; $('#view').innerHTML = vSetup();
      await aApi('/settings/prefs', { method: 'PUT', body: { [k]: !cur } }); return toast('Saved');
    }
    if ((el = q('[data-a-app]'))) { if (el.disabled) return; const a = A.apps.find((x) => x.uuid === el.dataset.aApp); const f = el.dataset.f; return adminPatchApp(a.uuid, { [f]: !(f === 'tracked' ? a.tracked : a.notify) }); }
    if ((el = q('[data-a-edit]'))) { A.editing = el.dataset.aEdit; $('#view').innerHTML = vManage(); $(`#a-name-${A.editing}`)?.focus(); return; }
    if ((el = q('[data-a-namesave]'))) { const u = el.dataset.aNamesave; const ok = await adminPatchApp(u, { displayName: $(`#a-name-${u}`).value }); if (ok) { A.editing = null; $('#view').innerHTML = vManage(); toast('✏️ Saved'); } return; }
    if ((el = q('[data-a-hook]'))) {
      const a = A.apps.find((x) => x.uuid === el.dataset.aHook);
      const url = prompt(`Send ${a.name}'s updates to a different Google Chat space?\n\nPaste that space's webhook URL, or leave empty to use the default space.`, '');
      if (url === null) return;
      if (await adminPatchApp(a.uuid, { chatWebhook: url.trim() })) toast(url.trim() ? '💬 Own Chat space set' : 'Using the default space');
      return;
    }
    if ((el = q('[data-a-bulk]'))) {
      const qq = A.manageQ.toLowerCase();
      const ids = A.apps.filter((a) => (!A.manageAcc || a.accountId === A.manageAcc) && (!qq || `${a.name} ${a.bundleOrPackage}`.toLowerCase().includes(qq))).map((a) => a.uuid);
      await aApi('/apps/bulk', { method: 'POST', body: { uuids: ids, tracked: el.dataset.aBulk === '1' } });
      toast(`Updated ${ids.length} apps`); return adminLoad('manage', true);
    }
    if ((el = q('[data-info]'))) { $(`#info-${el.dataset.info}`)?.classList.toggle('on'); return; }
    if (q('[data-g-editclient]')) { A.gmailEditClient = true; $('#view').innerHTML = vSetup(); return; }
    if (q('[data-g-saveclient]')) {
      try { await aApi('/gmail/client', { method: 'PUT', body: { clientId: $('#g-cid').value, clientSecret: $('#g-csec').value } }); A.gmailEditClient = false; toast('✅ OAuth client saved — now sign in'); }
      catch (err) { toast('⚠️ ' + esc(err.message)); }
      return adminLoad('setup', true);
    }
    if (q('[data-g-connect]')) { location.href = '/api/admin/gmail/connect'; return; }
    if (q('[data-g-disconnect]')) { if (!confirm('Disconnect Gmail? Play approvals and rejections will stop being detected.')) return; await aApi('/gmail', { method: 'DELETE' }); A.gmailTest = null; toast('Gmail disconnected'); return adminLoad('setup', true); }
    if (q('[data-g-togglequery]')) { A.gmailQuery = !A.gmailQuery; $('#view').innerHTML = vSetup(); return; }
    if (q('[data-g-savequery]')) { try { await aApi('/gmail/query', { method: 'PUT', body: { query: $('#g-query').value } }); toast('Saved'); } catch (err) { toast('⚠️ ' + esc(err.message)); } return adminLoad('setup', true); }
    if (q('[data-g-test]')) {
      A.gmailTest = { loading: true }; $('#view').innerHTML = vSetup();
      try { A.gmailTest = await aApi('/gmail/test', { method: 'POST' }); } catch (err) { A.gmailTest = { error: err.message }; }
      $('#view').innerHTML = vSetup(); return;
    }
    if ((el = q('[data-a-level]'))) { A.auditLevel = el.dataset.aLevel; A.audit = null; $('#view').innerHTML = vAudit(); return adminLoad('audit', true); }
    if (q('[data-a-reload]')) return adminLoad('audit', true);
  });
  document.addEventListener('change', async (e) => {
    const el = e.target.closest('[data-a-pref]');
    if (el) { const k = el.dataset.aPref; const v = el.type === 'time' ? el.value : Number(el.value); A.setup.prefs[k] = v; try { await aApi('/settings/prefs', { method: 'PUT', body: { [k]: v } }); toast('Saved'); } catch (err) { toast('⚠️ ' + esc(err.message)); } }
    if (e.target.id === 'a-acc') { A.manageAcc = e.target.value; $('#view').innerHTML = vManage(); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'a-q') { A.manageQ = e.target.value; const pos = e.target.selectionStart; $('#view').innerHTML = vManage(); const i = $('#a-q'); i.focus(); i.setSelectionRange(pos, pos); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id?.startsWith('a-name-')) $(`[data-a-namesave="${e.target.id.slice(7)}"]`)?.click(); });

  // ── app drawer ──
  function openApp(key) {
    const a = M.apps.find((x) => x.key === key);
    if (!a) return;
    openKey = key;
    const appId = a.key.split(':').slice(2).join(':');
    const chs = Object.values(a.channels);
    $('#drawer').innerHTML = `
      <div class="dr-h">${appIcon(a.name, a.iconUrl, 'lg')}<div style="min-width:0;flex:1"><div class="nm">${esc(a.name)}</div>
        <div class="sb">${storeIcon(a.store)} ${a.store === 'apple' ? 'iOS' : 'Android'} · ${esc(accLabel(a.accountId))}</div>
        <div class="sb"><code>${esc(a.bundleOrPackage)}</code><button class="ibtn sq" style="height:24px;width:24px" data-copytext="${esc(a.bundleOrPackage)}" title="Copy">${icon('copy', 'xs')}</button></div></div>
        <button class="ibtn sq" id="drClose" aria-label="Close">${icon('x')}</button></div>
      <div class="dr-b">
        <div class="dr-actions">${a.consoleUrl ? `<a class="ibtn primary" href="${esc(a.consoleUrl)}" target="_blank" rel="noopener">${icon('ext')}${a.store === 'apple' ? 'App Store Connect' : 'Play Console'}</a>` : ''}
          ${a.store === 'apple' ? `<a class="ibtn" href="https://appstoreconnect.apple.com/apps/${encodeURIComponent(appId)}/testflight/ios" target="_blank" rel="noopener">TestFlight</a>` : `<a class="ibtn" href="https://play.google.com/store/apps/details?id=${encodeURIComponent(a.bundleOrPackage)}" target="_blank" rel="noopener">Store listing</a>`}</div>
        <div class="sect">Current status</div>
        <div class="chgrid">${chs.length ? chs.map((c) => `<div class="chbox"><div class="h">${esc(c.channelLabel)}</div>${badge(c)}
          <div class="small">${esc(c.version || '—')}${c.liveVersion ? ` · live ${esc(c.liveVersion)}` : ''}${c.userFraction != null && c.category === 'live' ? ` · ${Math.round(c.userFraction * 100)}% rollout` : ''}</div>
          <div class="tiny">${c.elapsedMs != null ? `<b style="color:${sla(c.elapsedMs).color}">${dur(c.elapsedMs)} in review</b> · ` : ''}changed ${ago(c.since)}</div>
          ${c.submittedAt ? `<div class="tiny">Submitted ${fmt(c.submittedAt)}</div>` : ''}${c.reviewMs ? `<div class="tiny">Review took ${dur(c.reviewMs)}</div>` : ''}
          ${c.reason ? `<div class="reason">${esc(c.reason)}</div>` : ''}</div>`).join('') : '<div class="chbox" style="grid-column:1/-1"><div class="small">No submissions recorded yet.</div></div>'}</div>
        <div class="sect">History</div>
        ${a.history.length ? `<ul class="tl">${a.history.map((h) => `<li style="--c:var(--c-${h.category});--b:var(--b-${h.category})"><span class="nd"></span>
          <div class="w"><b>${esc(h.channelLabel)}</b> ${esc(h.version)} — ${esc(h.toLabel.replace(/^\S+\s/, ''))}</div>
          <div class="d">${fmt(h.at)} · ${ago(h.at)}${h.fromLabel ? ` · from ${esc(h.fromLabel.replace(/^\S+\s/, ''))}` : ''}</div>
          ${h.reason ? `<div class="r">${esc(h.reason)}</div>` : ''}</li>`).join('')}</ul>` : '<div class="small">No changes recorded yet.</div>'}
      </div>`;
    $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
    $('#drawer').setAttribute('aria-hidden', 'false');
    $('#drClose').focus();
  }
  const closeDrawer = () => { openKey = null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); };
  $('#scrim').onclick = closeDrawer;

  // ── command palette ──
  let palItems = [], palIdx = 0;
  function palRender() {
    const q = $('#palIn').value.trim().toLowerCase();
    const apps = M ? M.apps.filter((a) => !q || `${a.name} ${a.bundleOrPackage} ${accName(a.accountId)} ${Object.values(a.channels).map((c) => c.version + ' ' + c.label).join(' ')}`.toLowerCase().includes(q)).slice(0, 30) : [];
    const views = Object.entries(VIEWS).filter(([, v]) => !q || v.t.toLowerCase().includes(q)).map(([k, v]) => ({ kind: 'view', k, v }));
    const acts = [{ kind: 'act', id: 'refresh', t: 'Refresh all accounts', i: 'refresh' }, { kind: 'act', id: 'theme', t: 'Toggle dark / light theme', i: 'moon' }].filter((x) => !q || x.t.toLowerCase().includes(q));
    palItems = [...apps.map((a) => ({ kind: 'app', a })), ...views, ...acts];
    palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1));
    let i = 0, html = '';
    const it = (inner) => `<div class="pal-it ${i === palIdx ? 'on' : ''}" data-idx="${i++}">${inner}</div>`;
    if (apps.length) html += '<div class="pal-sec">Apps</div>' + apps.map((a) => {
      const top = Object.values(a.channels).sort((x, y) => (y.since || 0) - (x.since || 0))[0];
      return it(`${appIcon(a.name, a.iconUrl, 'sm')}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sb">${storeIcon(a.store)} ${esc(a.bundleOrPackage)} · ${esc(accName(a.accountId))}</div></div><span class="rt">${top ? badge(top, 'sm') : ''}</span>`);
    }).join('');
    if (views.length) html += '<div class="pal-sec">Go to</div>' + views.map((x) => it(`<span class="ico sm plain">${icon(x.v.i, 'xs')}</span><div class="nm">${x.v.t}</div>`)).join('');
    if (acts.length) html += '<div class="pal-sec">Actions</div>' + acts.map((x) => it(`<span class="ico sm plain">${icon(x.i, 'xs')}</span><div class="nm">${x.t}</div>`)).join('');
    $('#palList').innerHTML = html || '<div class="empty" style="padding:28px"><b>No matches</b></div>';
    $('.pal-it.on')?.scrollIntoView({ block: 'nearest' });
  }
  const openPal = () => { $('#pal').classList.add('on'); $('#palIn').value = ''; palIdx = 0; palRender(); setTimeout(() => $('#palIn').focus(), 10); };
  const closePal = () => $('#pal').classList.remove('on');
  function palPick(idx) {
    const x = palItems[idx]; if (!x) return;
    closePal();
    if (x.kind === 'app') openApp(x.a.key);
    else if (x.kind === 'view') go(x.k);
    else if (x.id === 'refresh') refresh();
    else toggleTheme();
  }
  $('#openPal').onclick = openPal;
  $('#palIn').addEventListener('input', () => { palIdx = 0; palRender(); });
  $('#palIn').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { palIdx = Math.min(palItems.length - 1, palIdx + 1); palRender(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { palIdx = Math.max(0, palIdx - 1); palRender(); e.preventDefault(); }
    else if (e.key === 'Enter') palPick(palIdx);
  });
  $('#palList').addEventListener('click', (e) => { const it = e.target.closest('.pal-it'); if (it) palPick(Number(it.dataset.idx)); });
  $('#pal').addEventListener('click', (e) => { if (e.target.id === 'pal') closePal(); });

  // ── toasts + desktop alerts ──
  function toast(html, ms = 4200) {
    const el = document.createElement('div');
    el.className = 'toast'; el.innerHTML = html;
    $('#toasts').append(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
  }
  const notifOn = () => LS.get('notif') === '1' && 'Notification' in window && Notification.permission === 'granted';
  const paintNotif = () => $('#notif').classList.toggle('on', notifOn());
  $('#notif').onclick = async () => {
    if (!('Notification' in window)) return toast('This browser does not support desktop notifications.');
    if (notifOn()) { LS.set('notif', '0'); paintNotif(); return toast('🔕 Desktop alerts off'); }
    const p = await Notification.requestPermission();
    LS.set('notif', p === 'granted' ? '1' : '0'); paintNotif();
    toast(p === 'granted' ? '🔔 Desktop alerts on. You’ll be notified while this tab is open.' : 'Notifications are blocked in your browser settings.');
  };

  // ── theme ──
  const curTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function toggleTheme() { const t = curTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; LS.set('theme', t); }
  if (LS.get('theme')) document.documentElement.dataset.theme = LS.get('theme');
  $('#theme').onclick = toggleTheme;

  // ── global events ──
  $('#storeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(S.view, { store: b.dataset.v, account: '' }); });
  $('#accSel').addEventListener('change', (e) => go(S.view, { account: e.target.value }));
  document.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.closest('a[href^="http"]')) return; // external links just open
    const c = t.closest('[data-copy]');
    if (c) { const r = M.attention.filter(passes)[Number(c.dataset.copy)]; try { await navigator.clipboard.writeText(r?.reason || ''); toast('📋 Reason copied'); } catch { toast('Copy failed'); } return; }
    const ct = t.closest('[data-copytext]');
    if (ct) { try { await navigator.clipboard.writeText(ct.dataset.copytext); toast('📋 Copied'); } catch { toast('Copy failed'); } return; }
    if (t.closest('#drClose')) return closeDrawer();
    const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
    const l = t.closest('[data-l]'); if (l) { S.layout = l.dataset.l; LS.set('layout', S.layout); return render(); }
    const ac = t.closest('[data-act]'); if (ac) { S.actCat = ac.dataset.act; return render(); }
    const fa = t.closest('[data-filter-acc]'); if (fa) { const a = M.accounts.find((x) => x.id === fa.dataset.filterAcc); return go('apps', { account: a.id, store: a.store }); }
    const ap = t.closest('[data-app]'); if (ap) return openApp(ap.dataset.app);
  });
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('#pal').classList.contains('on') ? closePal() : openPal(); }
    if (e.key === 'Escape') { closePal(); closeDrawer(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); openPal(); }
    else if (e.key === 'r') refresh();
    else if (e.key === 't') toggleTheme();
    else if (/^[1-6]$/.test(e.key)) go(Object.keys(VIEWS)[Number(e.key) - 1]);
  });

  // ── render + data ──
  function countUp() {
    $$('[data-count]').forEach((el) => {
      const to = Number(el.dataset.count); if (!to) return;
      const t0 = performance.now();
      const step = (t) => { const p = Math.min(1, (t - t0) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  function render() {
    if (!M) return;
    renderNav(); renderTop();
    if (VIEWS[S.view].admin && !M.admin) S.view = 'overview';
    $('#view').innerHTML = { overview: vOverview, review: vReview, attention: vAttention, apps: vApps, accounts: vAccounts, activity: vActivity, setup: vSetup, manage: vManage, audit: vAudit }[S.view]();
    if (VIEWS[S.view].admin) adminLoad(S.view);
    const att = M.attention.length;
    document.title = (att ? `(${att}) ` : '') + `${VIEWS[S.view].t} · Review Radar`;
  }
  function skeleton() {
    $('#view').innerHTML = `<div class="sk" style="height:58px;width:min(520px,80%);margin:6px 0 18px"></div><div class="kpis">${'<div class="sk" style="height:142px"></div>'.repeat(4)}</div><div class="sk" style="height:80px;margin-bottom:18px"></div><div class="two"><div class="sk" style="height:380px"></div><div class="sk" style="height:380px"></div></div>`;
  }

  async function load({ manual = false } = {}) {
    try {
      const res = await fetch('/api/dashboard', { credentials: 'same-origin', cache: 'no-store' });
      if (res.status === 401) return location.reload();
      const next = await res.json();
      tz = next.tz || tz;
      const ids = next.activity.map((e) => e.id);
      if (firstLoad) {
        if (seenIds.size) freshIds = new Set(ids.filter((id) => !seenIds.has(id)));
      } else {
        const prev = new Set(M.activity.map((e) => e.id));
        const added = next.activity.filter((e) => !prev.has(e.id));
        added.forEach((e) => freshIds.add(e.id));
        if (added.length) {
          const e = added[0];
          toast(`<span style="font-size:20px">${esc(e.emoji)}</span><div><b>${esc(e.appName)} ${esc(e.version)}</b><div class="small">${esc(e.channelLabel)} → ${esc(e.label)}${added.length > 1 ? ` · +${added.length - 1} more` : ''}</div></div>`, 7000);
          if (notifOn()) added.slice(0, 3).forEach((x) => { try { new Notification(`${x.emoji} ${x.appName} ${x.version}`, { body: `${x.channelLabel}: ${x.label}\n${x.accountName}`, tag: x.id }); } catch {} });
        } else if (manual) toast('✅ Up to date. No new changes.');
      }
      seenIds = new Set(ids); LS.set('seen', JSON.stringify(ids.slice(0, 200)));
      M = next;
      if (M.user && $('#me').hidden) { $('#me').hidden = false; $('#meEmail').textContent = M.user; $('#meav').textContent = M.user[0].toUpperCase(); }
      render();
      if (firstLoad) { firstLoad = false; if (S.view === 'overview') countUp(); }
    } catch (err) {
      console.error(err);
      $('#liveTxt').textContent = 'Offline · retrying…';
      $('#pulse').classList.add('bad');
      if (firstLoad) $('#view').innerHTML = `<div class="card">${empty('📡', "Can't reach the server", 'Retrying every 30 seconds.')}</div>`;
    }
  }
  async function refresh() {
    const b = $('#refresh'); if (b.disabled) return;
    b.disabled = true; b.classList.add('spin');
    toast('↻ Polling Apple and Google for every account…', 2500);
    await fetch('/api/refresh', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
    setTimeout(async () => { await load({ manual: true }); b.disabled = false; b.classList.remove('spin'); }, 5000);
  }
  $('#refresh').onclick = refresh;
  $('#logout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {}); location.href = '/login'; };

  (() => {
    const m = location.hash.match(/[?&](gmail|chat)=([^&]+)/);
    if (!m) return;
    const v = decodeURIComponent(m[2]);
    const okMsg = m[1] === 'chat' ? '💬 Signed in to Google Chat — now click Find my spaces' : '📬 Gmail connected — the bot will read Play emails from now on';
    setTimeout(() => toast(v === 'ok-sent' ? '✅ Connected — app_review_bot just posted a hello in your space' : v === 'ok' ? okMsg : `⚠️ ${m[1] === 'chat' ? 'Google Chat' : 'Gmail'}: ` + esc(v.replace(/^error:/, '')), 7000), 600);
    if (m[1] === 'chat') A.chatMode = 'user';
    history.replaceState(null, '', '#/setup');
  })();
  readHash();
  paintNotif();
  skeleton();
  load();
  setInterval(() => load(), 30000);
  setInterval(() => { if (M && !$('#drawer').classList.contains('on') && !$('#pal').classList.contains('on') && !document.hidden) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up Review Radar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23121212%22/><circle cx=%2216%22 cy=%2216%22 r=%228%22 fill=%22none%22 stroke=%22%239fd34a%22 stroke-width=%222.5%22/><circle cx=%2216%22 cy=%2216%22 r=%222.5%22 fill=%22%239fd34a%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("rr-theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
:root{
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#ececea; --bg-2:#f2f2f0; --panel:#fff; --panel-2:#f6f6f4; --line:#ececea; --line-2:#dcdcd8;
  --text:#121212; --text-2:#3b3b3a; --muted:#7b7b78; --faint:#a6a6a2;
  --accent:#4d8a0c; --accent-2:#8cc63f; --accent-soft:#eef6e0; --ring:rgba(140,198,63,.35);
  --lime:#9fd34a; --ink:#121212; --on-ink:#fff;
  --ok:#2f7d32; --ok-b:#e3f2df; --bad:#d63a33; --bad-b:#fde7e5; --warn:#c26a00; --warn-b:#fdefd9;
  --c-in_review:#b88d00; --b-in_review:#fbf3cf; --c-submitted:#d4741c; --b-submitted:#fdeedd;
  --c-approved:#4d8a0c; --b-approved:#eef6e0; --c-live:#2f7d32; --b-live:#e3f2df;
  --c-rejected:#d63a33; --b-rejected:#fde7e5; --c-action:#c26a00; --b-action:#fdefd9;
  --c-removed:#b4234a; --b-removed:#fce5ec; --c-draft:#6b6b68; --b-draft:#efefed;
  --c-testing:#4f6d92; --b-testing:#e8eef6; --c-none:#a6a6a2; --b-none:#f2f2f0;
  --shadow:none; --shadow-lg:0 30px 60px -20px rgba(15,18,25,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0d; --bg-2:#1b1b1d; --panel:#151516; --panel-2:#1c1c1e; --line:#242426; --line-2:#323235;
    --text:#f3f3f1; --text-2:#d2d2cf; --muted:#9a9a96; --faint:#6c6c69;
    --accent:#a8dc58; --accent-2:#c6ec86; --accent-soft:#1f2911; --ring:rgba(168,220,88,.35);
    --ink:#f3f3f1; --on-ink:#121212;
    --ok:#72cf6a; --ok-b:#132611; --bad:#ff6f66; --bad-b:#331615; --warn:#f5b54a; --warn-b:#2e2210;
    --c-in_review:#f0d24c; --b-in_review:#2a250d; --c-submitted:#f5a25a; --b-submitted:#2e1f10;
    --c-approved:#a8dc58; --b-approved:#1f2911; --c-live:#72cf6a; --b-live:#132611;
    --c-rejected:#ff6f66; --b-rejected:#331615; --c-action:#f5b54a; --b-action:#2e2210;
    --c-removed:#f06292; --b-removed:#33141f; --c-draft:#a0a09c; --b-draft:#202022;
    --c-testing:#9fb3c8; --b-testing:#1b1f24; --c-none:#6c6c69; --b-none:#1c1c1e;
    --shadow:none; --shadow-lg:0 30px 70px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
    --bg:#0c0c0d; --bg-2:#1b1b1d; --panel:#151516; --panel-2:#1c1c1e; --line:#242426; --line-2:#323235;
    --text:#f3f3f1; --text-2:#d2d2cf; --muted:#9a9a96; --faint:#6c6c69;
    --accent:#a8dc58; --accent-2:#c6ec86; --accent-soft:#1f2911; --ring:rgba(168,220,88,.35);
    --ink:#f3f3f1; --on-ink:#121212;
    --ok:#72cf6a; --ok-b:#132611; --bad:#ff6f66; --bad-b:#331615; --warn:#f5b54a; --warn-b:#2e2210;
    --c-in_review:#f0d24c; --b-in_review:#2a250d; --c-submitted:#f5a25a; --b-submitted:#2e1f10;
    --c-approved:#a8dc58; --b-approved:#1f2911; --c-live:#72cf6a; --b-live:#132611;
    --c-rejected:#ff6f66; --b-rejected:#331615; --c-action:#f5b54a; --b-action:#2e2210;
    --c-removed:#f06292; --b-removed:#33141f; --c-draft:#a0a09c; --b-draft:#202022;
    --c-testing:#9fb3c8; --b-testing:#1b1f24; --c-none:#6c6c69; --b-none:#1c1c1e;
    --shadow:none; --shadow-lg:0 30px 70px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg-2);padding:1px 6px;border-radius:5px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px} svg.i.lg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;border-radius:26px;padding:28px 24px;display:flex;flex-direction:column;gap:28px;background:#121212;color:#f3f3f1;overflow:hidden}
.rail::after{content:"";position:absolute;width:150px;height:110px;right:-10px;bottom:-10px;border-radius:18px;background-color:#9fd34a;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 1.5px,transparent 1.5px 6px);opacity:.14;pointer-events:none}
.brand{display:flex;gap:11px;align-items:center}
.logo{width:38px;height:38px;border-radius:11px;background:#9fd34a;display:grid;place-items:center}
.logo i{width:16px;height:16px;border:2.5px solid #121212;border-radius:50%;position:relative}
.logo i::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#121212}
.brand b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12px;color:#9a9a96}
.rail h2{font-size:24px;line-height:1.2;letter-spacing:-.03em;margin:0;font-weight:800}
.rail p{margin:8px 0 0;color:#a9a9a5;font-size:13.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:14px;color:#9a9a96;cursor:default;transition:background .15s}
.steps li.reach{cursor:pointer}
.steps li.reach:hover{background:rgba(255,255,255,.05)}
.steps li.on{background:rgba(255,255,255,.08);color:#fff}
.steps .n{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12.5px;font-weight:650;flex:none}
.steps li.on .n{background:#9fd34a;color:#121212;border-color:#9fd34a}
.steps li.done .n{background:transparent;border-color:#9fd34a;color:#9fd34a}
.steps .t{font-weight:700;font-size:13.5px;color:inherit}
.steps .s{font-size:12px;color:#7b7b78;margin-top:1px}
.steps li.on .s{color:#bdbdb9}
.rail .foot{margin-top:auto;font-size:12px;color:#9a9a96;display:flex;gap:8px;align-items:center;position:relative;z-index:1}
.dot{width:8px;height:8px;border-radius:50%;background:#9fd34a;flex:none}

main{padding:40px clamp(16px,5vw,64px) 80px;max-width:980px;width:100%}
.eyebrow{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#121212;background:#9fd34a;border-radius:99px;padding:3px 10px;font-weight:800;margin-bottom:6px}
h1{font-size:32px;letter-spacing:-.035em;margin:4px 0 6px;font-weight:800}
.lead{color:var(--muted);font-size:15px;margin:0 0 26px;max-width:640px}

.card{background:var(--panel);border:0;border-radius:22px;box-shadow:none}
.pad{padding:24px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:20px;border:2px solid transparent;border-radius:20px;background:var(--panel);transition:border-color .15s,box-shadow .15s,transform .15s}
.choice:hover{border-color:var(--line-2);transform:translateY(-1px)}
.choice.on{border-color:#9fd34a;box-shadow:0 0 0 4px var(--ring)}
.choice .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--panel-2);border:0}
.choice .ic svg{width:22px;height:22px}
.choice b{display:block;font-size:15.5px;font-weight:800}
.choice span{font-size:12.5px;color:var(--muted)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:600;color:var(--text-2)}
.help{font-size:12px;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=time],select{height:46px;border:1.5px solid transparent;border-radius:13px;background:var(--panel-2);padding:0 13px;width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{outline:none;border-color:#86c232;box-shadow:0 0 0 4px var(--ring);background:var(--panel)}
input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.drop{border:1.5px dashed var(--line-2);border-radius:18px;padding:20px;display:flex;gap:14px;align-items:center;background:var(--panel-2);transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:#86c232;background:var(--accent-soft)}
.drop.has{border-style:solid;border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:var(--ok-b)}
.drop .ic{width:42px;height:42px;border-radius:13px;background:var(--panel);border:0;display:grid;place-items:center;flex:none;color:var(--accent)}
.drop.has .ic{color:var(--ok)}
.drop b{display:block;font-size:13.5px}
.drop span{font-size:12.5px;color:var(--muted)}
details.how{margin-top:16px;border:0;border-radius:16px;background:var(--panel-2)}
details.how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13.5px;list-style:none;display:flex;gap:8px;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how[open] summary{border-bottom:1px solid var(--line)}
details.how ol{margin:0;padding:14px 18px 16px 36px;color:var(--text-2);font-size:13.5px;display:flex;flex-direction:column;gap:7px}

.actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:13px;border:0;background:var(--panel-2);font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:filter .12s,background .12s,border-color .12s}
.btn:hover{background:var(--line)}
.btn.primary{border:0;color:var(--on-ink);background:var(--ink)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.grow{flex:1}

/* verification checklist */
.checks{margin-top:20px;border:0;border-radius:18px;overflow:hidden;background:var(--panel-2)}
.checks .h{padding:12px 16px;font-weight:600;font-size:13.5px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.ck{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start;animation:in .25s ease both}
.ck:first-of-type{border-top:0}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.ck .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.ck .st.ok{background:var(--ok-b);color:var(--ok)}
.ck .st.bad{background:var(--bad-b);color:var(--bad)}
.ck .st.run{border:2px solid var(--line-2);border-top-color:#86c232;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ck .lb{font-weight:600;font-size:13.5px}
.ck .dt{font-size:12.5px;color:var(--muted);word-break:break-word}
.ck .hint{font-size:12.5px;color:var(--text-2);margin-top:4px;background:var(--warn-b);border-radius:8px;padding:6px 9px}

.connected{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.acc{display:flex;gap:12px;align-items:center;padding:14px 16px;border:0;border-radius:18px;background:var(--panel)}
.acc .ic{width:40px;height:40px;border-radius:12px;background:var(--panel-2);border:0;display:grid;place-items:center;flex:none}
.acc b{display:block;font-size:14px}
.acc span{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-b);color:var(--ok)}
.pill.bad{background:var(--bad-b);color:var(--bad)}
.pill.warn{background:var(--warn-b);color:var(--warn)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* apps step */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:12px;top:12px;color:var(--faint)}
.search input{padding-left:36px}
.group{margin-bottom:18px}
.gh{display:flex;align-items:center;gap:10px;padding:0 4px 10px}
.gh b{font-size:14.5px}
.gh span{font-size:12.5px;color:var(--muted)}
.list{border:0;border-radius:20px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);transition:background .1s}
.row:first-child{border-top:0}
.row.off{opacity:.55}
.row:hover{background:var(--panel-2)}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;flex:none;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chans{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--c);background:var(--b)}
.badge small{font-weight:500;opacity:.8}
.toggles{display:flex;gap:6px}
.tg{height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--panel);display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.tg.on{color:var(--on-ink);border-color:transparent;background:var(--ink)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--panel);flex:none;cursor:pointer}
.check.on{background:#9fd34a;border-color:#9fd34a;color:#121212}
.syncing{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500;margin-bottom:14px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
.skel{height:62px;border-top:1px solid var(--line);background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 37%,var(--panel) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* chat step */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:g}
.guide li{display:flex;gap:12px;padding:10px 0;counter-increment:g}
.guide li::before{content:counter(g);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.guide b{font-weight:600}
.copy{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font:600 12.5px ui-monospace,Menlo,monospace;margin:4px 0 0;vertical-align:middle}
.copy:hover{border-color:#86c232;color:var(--accent)}
.preview{background:var(--panel-2);border:0;border-radius:20px;padding:18px}
.preview .ttl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:650;margin-bottom:12px}
.msg{display:flex;gap:11px}
.av{width:36px;height:36px;border-radius:50%;background:#9fd34a;display:grid;place-items:center;flex:none}
.av i{width:14px;height:14px;border:2px solid #121212;border-radius:50%;position:relative}
.av i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#121212}
.who{font-size:13px;font-weight:650;display:flex;gap:6px;align-items:center}
.who em{font-style:normal;font-size:10.5px;font-weight:650;padding:1px 5px;border-radius:4px;background:var(--bg-2);color:var(--muted)}
.who span{font-weight:400;color:var(--faint);font-size:11.5px}
.gcard{margin-top:6px;background:var(--panel);border:0;border-radius:16px;overflow:hidden;max-width:360px}
.gcard .hd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.gcard .hd .ico{width:30px;height:30px;font-size:13px;border-radius:8px}
.gcard .hd b{display:block;font-size:13.5px}
.gcard .hd span{font-size:11.5px;color:var(--muted)}
.gcard .kv{padding:10px 14px;display:grid;gap:8px}
.gcard .kv div{font-size:12.5px}
.gcard .kv small{display:block;font-size:11px;color:var(--faint)}
.gcard .bt{padding:4px 14px 12px;display:flex;gap:6px}
.gcard .bt span{font-size:12px;font-weight:600;color:var(--accent);padding:5px 9px;border-radius:7px;background:var(--accent-soft)}
.result{margin-top:12px;font-size:13px;display:flex;gap:8px;align-items:center;padding:11px 14px;border-radius:14px}
.result.ok{background:var(--ok-b);color:var(--ok)}
.result.bad{background:var(--bad-b);color:var(--bad)}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.switch{display:flex;gap:10px;align-items:center;height:42px}
.sw{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;border:0;flex:none}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#86c232}
.sw.on::after{left:19px}

/* done */
.hero{text-align:center;padding:36px 22px 28px}
.burst{width:76px;height:76px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;background-color:#9fd34a;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 1.5px,transparent 1.5px 6px);color:#121212;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 0}
.sum{border:0;border-radius:18px;padding:16px;text-align:left;background:var(--panel-2)}
.sum b{display:block;font-size:28px;font-weight:800;letter-spacing:-.035em}
.sum span{font-size:12.5px;color:var(--muted)}
.tasks{margin-top:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:10px;align-items:center;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:10;animation:in .2s ease}

.mobile-steps{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:18px 16px;gap:14px;margin:12px 12px 0}
  .rail h2,.rail p,.rail .foot,.steps{display:none}
  .mobile-steps{display:flex;gap:6px;margin-top:4px}
  .mobile-steps i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.2)}
  .mobile-steps i.on{background:#9fd34a}
  .mobile-steps i.done{background:#5e7d33}
  main{padding:24px 16px 60px}
  h1{font-size:23px}
  .choices,.form,.split,.prefs,.summary{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:auto minmax(0,1fr) auto}
  .row .chans{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="logo"><i></i></div><div><b>Review Radar</b><span>with app_review_bot</span></div></div>
    <div class="mobile-steps" id="mSteps"></div>
    <div><h2>Every app review, every account, one place.</h2><p>Connect your developer accounts, choose the apps to watch, and let <b>app_review_bot</b> post every status change to Google Chat.</p></div>
    <ol class="steps" id="steps"></ol>
    <div class="foot"><span class="dot"></span>Keys are encrypted (AES-256) before they're stored.</div>
  </aside>
  <main id="main"></main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-apple" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.72-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.6 1.1 8.75.73 1.05 1.6 2.23 2.73 2.19 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.5zM14.2 6.14c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M4.2 2.6c-.1.2-.2.5-.2.8v17.2c0 .3.1.6.2.8l9.6-9.4-9.6-9.4Zm10.8 10.6 2.7 2.7-11.9 6.8 9.2-9.5Zm4.1-4.1 2.4 1.4c.7.4.7 1.5 0 1.9l-2.4 1.4-3-3 3-1.7Zm-1.4-.8L5.8 1.4 15 10.9l2.7-2.6Z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
  <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5M17 17H3s3-2 3-9a4.7 4.7 0 0 1 .3-1.7M10.3 21a1.9 1.9 0 0 0 3.4 0M2 2l20 20"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
  <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.2 2.2 0 0 0-2.9-.1Z"/><path d="m12 15-3-3a22 22 0 0 1 2-4A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22.4 22.4 0 0 1-4 2Z"/><path d="M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5"/></symbol>
</svg>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ic = (id, cls = 'sm') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
  const storeIc = (s, cls = 'sm') => ic(s === 'apple' ? 'apple' : 'play', cls);
  const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const appIcon = (n, url) => url ? `<span class="ico"><img src="${esc(url)}" alt=""></span>` : `<span class="ico" style="background:linear-gradient(135deg,hsl(${hue(n)} 62% 56%),hsl(${(hue(n) + 40) % 360} 58% 44%))">${esc((n || '?')[0].toUpperCase())}</span>`;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function api(path, opts = {}) {
    const res = await fetch('/api/admin' + path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (res.status === 401) { location.href = '/login?next=/onboarding'; throw new Error('unauthorized'); }
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, ...json };
  }
  function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { toast('Copy failed'); } }

  const STEPS = [
    { t: 'Connect accounts', s: 'App Store Connect · Google Play' },
    { t: 'Choose apps', s: 'Pick what the bot watches' },
    { t: 'Google Chat bot', s: 'Connect app_review_bot' },
    { t: 'All set', s: 'Open your dashboard' },
  ];
  const S = { step: 0, setup: null, store: 'apple', file: null, fileName: '', verifying: false, checks: null, apps: [], discovered: new Set(), filter: '', chatUrl: '', chatResult: null, prefs: {} };

  const done = (i) => {
    const s = S.setup;
    if (!s) return false;
    if (i === 0) return s.accounts.length > 0;
    if (i === 1) return s.apps.tracked > 0;
    if (i === 2) return s.chat.configured;
    return s.bot.onboarded;
  };
  const reachable = (i) => i === 0 || (i === 1 && done(0)) || (i === 2 && done(0)) || (i === 3 && done(0));

  function renderRail() {
    $('#steps').innerHTML = STEPS.map((x, i) => `<li class="${i === S.step ? 'on' : ''} ${done(i) && i !== S.step ? 'done' : ''} ${reachable(i) ? 'reach' : ''}" data-step="${i}">
      <span class="n">${done(i) && i !== S.step ? ic('check') : i + 1}</span><div><div class="t">${x.t}</div><div class="s">${x.s}</div></div></li>`).join('');
    $('#mSteps').innerHTML = STEPS.map((_, i) => `<i class="${i === S.step ? 'on' : done(i) ? 'done' : ''}"></i>`).join('');
  }
  $('#steps').addEventListener('click', (e) => { const li = e.target.closest('li.reach'); if (li) go(Number(li.dataset.step)); });

  function go(i) {
    S.step = i;
    render();
    scrollTo({ top: 0, behavior: 'smooth' });
    if (i === 1) startApps();
  }

  // ── step 1: accounts ──
  function vAccounts() {
    const a = S.store === 'apple';
    const accs = S.setup.accounts;
    return `
      <div class="eyebrow">Step 1 of 4</div>
      <h1>${accs.length ? 'Your developer accounts' : 'Connect your first developer account'}</h1>
      <p class="lead">Add the WebMob App Store Connect team and Google Play developer account. Each key is verified live before it's saved, and you can add more organisations later from Admin → Setup.</p>
      ${accs.length ? `<div class="connected" style="margin:0 0 22px">${accs.map(accRow).join('')}</div>` : ''}
      <div class="card pad">
        <div class="choices">
          <button class="choice ${a ? 'on' : ''}" data-store="apple"><span class="ic">${storeIc('apple', 'lg')}</span><div><b>App Store Connect</b><span>App Store + TestFlight · one API key per team</span></div></button>
          <button class="choice ${!a ? 'on' : ''}" data-store="google"><span class="ic">${storeIc('google', 'lg')}</span><div><b>Google Play Console</b><span>All tracks · one service account per developer account</span></div></button>
        </div>
        <div class="form">
          <div class="field ${a ? '' : 'full'}"><label for="f-name">Account name</label><input type="text" id="f-name" value="${esc($('#f-name')?.value || 'WebMob Technologies')}" placeholder="e.g. WebMob Technologies"><span class="help">How this account is labelled on the dashboard and in Chat.</span></div>
          ${a ? `
          <div class="field"><label for="f-issuer">Issuer ID</label><input type="text" class="mono" id="f-issuer" placeholder="69a6de7e-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off"><span class="help">Shown above the keys list in App Store Connect.</span></div>
          <div class="field full"><label>Private key (.p8)</label>${dropzone('.p8', 'Drop AuthKey_XXXXXXXXXX.p8 here or click to choose', 'Downloaded once when you created the key')}</div>
          <div class="field"><label for="f-key">Key ID</label><input type="text" class="mono" id="f-key" placeholder="ABC123XYZ9" autocomplete="off"><span class="help">Filled in automatically from the file name.</span></div>` : `
          <div class="field full"><label>Service-account key (JSON)</label>${dropzone('.json', 'Drop the service-account .json here or click to choose', 'Google Cloud → IAM → Service accounts → Keys → Add key → JSON')}</div>
          <div class="field full"><label for="f-dev">Play developer ID <span class="help">(optional)</span></label><input type="text" class="mono" id="f-dev" placeholder="1234567890123456789" autocomplete="off"><span class="help">From the Play Console URL (…/developers/<b>this-number</b>/…). Used for direct links.</span></div>`}
        </div>
        ${a ? `<details class="how"><summary>${ic('help')} Where do I find these?</summary><ol>
          <li>Open <a href="https://appstoreconnect.apple.com/access/integrations/api" target="_blank" rel="noopener">App Store Connect → Users and Access → Integrations → App Store Connect API</a>.</li>
          <li>Choose <b>Team Keys</b> → <b>+</b>. Name it <code>app_review_bot</code>, access <b>Admin</b> (or App Manager if you won't use webhooks).</li>
          <li>Download the <code>.p8</code> file — Apple only lets you download it once.</li>
          <li>Copy the <b>Issuer ID</b> shown above the list. The Key ID is in the file name.</li></ol></details>`
        : `<details class="how"><summary>${ic('help')} Where do I find these?</summary><ol>
          <li>In <a href="https://console.cloud.google.com/apis/library" target="_blank" rel="noopener">Google Cloud</a>, enable <b>Google Play Android Developer API</b> and <b>Google Play Developer Reporting API</b>.</li>
          <li>IAM → Service accounts → <b>Create</b> (name <code>app-review-bot</code>) → Keys → Add key → <b>JSON</b>.</li>
          <li>In <a href="https://play.google.com/console/u/0/developers/users-and-permissions" target="_blank" rel="noopener">Play Console → Users and permissions</a>, invite the service-account email with <b>View app information</b> for all apps (and <b>Release to testing tracks</b> so it can read tracks).</li>
          <li>Wait a few minutes for Google to apply the permission, then verify here.</li></ol></details>`}
        ${S.checks ? checksHtml() : ''}
        <div class="actions">
          <button class="btn primary" id="verify" ${S.verifying ? 'disabled' : ''}>${S.verifying ? '<span class="spin"></span>Verifying…' : `${ic('check')}Verify &amp; connect`}</button>
          <div class="grow"></div>
          ${accs.length ? `<button class="btn" data-go="1">Continue ${ic('arrow')}</button>` : ''}
        </div>
      </div>`;
  }
  const dropzone = (accept, title, sub) => `<div class="drop ${S.file ? 'has' : ''}" id="drop" tabindex="0" role="button"><span class="ic">${ic(S.file ? 'file' : 'upload', 'lg')}</span><div><b>${S.file ? esc(S.fileName) : title}</b><span>${S.file ? 'Ready — click to replace' : sub}</span></div><input type="file" id="file" accept="${accept}" hidden></div>`;
  const accRow = (a) => `<div class="acc"><span class="ic">${storeIc(a.store)}</span><div class="grow" style="min-width:0"><b>${esc(a.name)}</b><span>${a.store === 'apple' ? `App Store Connect · key ${esc(a.keyId || '')}` : `Google Play · ${esc(a.clientEmail || '')}`} · ${a.appCount ? `${a.appCount} apps` : 'apps not fetched yet'}</span></div>
    ${a.error ? `<span class="pill bad" title="${esc(a.error)}">Error</span>` : a.polling ? '<span class="pill run">Syncing</span>' : '<span class="pill ok">Verified</span>'}
    <button class="btn ghost sm" data-remove="${esc(a.id)}" title="Remove account">${ic('trash')}</button></div>`;
  function checksHtml() {
    const c = S.checks;
    return `<div class="checks"><div class="h">${c.running ? '<span class="spin" style="color:var(--accent)"></span>Checking your credentials…' : c.ok ? `<span style="color:var(--ok)">${ic('check')}</span>Connected` : `<span style="color:var(--bad)">${ic('x')}</span>Couldn't connect — fix the item below and retry`}</div>
      ${c.items.map((s) => `<div class="ck"><span class="st ${s.ok === null ? 'run' : s.ok ? 'ok' : 'bad'}">${s.ok === null ? '' : ic(s.ok ? 'check' : 'x', 'sm')}</span><div style="min-width:0"><div class="lb">${esc(s.label)}</div>${s.detail ? `<div class="dt">${esc(s.detail)}</div>` : ''}${s.hint ? `<div class="hint">${esc(s.hint)}</div>` : ''}</div></div>`).join('')}</div>`;
  }

  async function verify() {
    const name = $('#f-name').value.trim();
    const body = { store: S.store, name };
    if (S.store === 'apple') {
      body.issuerId = $('#f-issuer').value.trim();
      body.keyId = $('#f-key').value.trim();
      body.privateKey = S.file;
      if (!body.issuerId || !body.keyId || !body.privateKey) return toast('Add the Issuer ID, Key ID and the .p8 file');
    } else {
      body.serviceAccountJson = S.file;
      body.developerId = $('#f-dev').value.trim();
      if (!body.serviceAccountJson) return toast('Add the service-account JSON file');
    }
    const keep = S.store === 'apple' ? { issuer: body.issuerId, key: body.keyId } : { dev: body.developerId };
    S.verifying = true;
    const pending = S.store === 'apple' ? ['Private key (.p8) is valid', 'Signed API token (ES256)', 'Connected to App Store Connect', 'Listing apps'] : ['Service-account JSON is valid', 'Signed in to Google', 'Play Developer Reporting API reachable', 'Listing apps', 'Can read release tracks'];
    S.checks = { running: true, items: [{ label: pending[0], ok: null }] };
    render(keep);
    let i = 1;
    const ticker = setInterval(() => { if (i < pending.length && S.checks.running) { S.checks.items = pending.slice(0, ++i).map((l, k) => ({ label: l, ok: k < i - 1 ? true : null })); render(keep); } }, 700);
    const r = await api('/accounts', { method: 'POST', body });
    clearInterval(ticker);
    // reveal real results one by one
    S.checks = { running: true, items: [] };
    for (const s of r.steps || [{ label: 'Connect', ok: false, detail: r.error }]) { S.checks.items.push(s); render(keep); await sleep(180); }
    S.checks.running = false;
    S.checks.ok = r.ok;
    S.verifying = false;
    if (r.ok) {
      S.file = null; S.fileName = '';
      await refreshSetup();
      toast(`${r.account.name} connected — ${r.apps.length} apps found`);
      render();
    } else render(keep);
  }

  function readFile(f) {
    if (!f) return;
    if (f.size > 200_000) return toast('That file is too large to be a key');
    const rd = new FileReader();
    rd.onload = () => {
      S.file = String(rd.result);
      S.fileName = f.name;
      const keep = keepValues();
      const m = f.name.match(/AuthKey_([A-Z0-9]{8,12})\.p8/i);
      if (m && S.store === 'apple') keep.key = m[1].toUpperCase();
      if (S.store === 'google') { try { const j = JSON.parse(S.file); if (j.client_email) S.fileName = `${f.name} · ${j.client_email}`; } catch { toast('That is not a JSON file'); S.file = null; S.fileName = ''; } }
      render(keep);
    };
    rd.readAsText(f);
  }
  const keepValues = () => ({ issuer: $('#f-issuer')?.value, key: $('#f-key')?.value, dev: $('#f-dev')?.value });

  // ── step 2: apps ──
  let appsTimer = null;
  async function startApps() {
    clearInterval(appsTimer);
    await loadApps();
    render();
    for (const a of S.setup.accounts) {
      if (S.discovered.has(a.id) || a.error) continue;
      S.discovered.add(a.id);
      S.discovering = (S.discovering || 0) + 1;
      render();
      const r = await api(`/accounts/${a.id}/discover`, { method: 'POST' });
      S.discovering--;
      if (!r.ok) toast(`${a.name}: ${r.error || 'could not fetch apps'}`);
      await loadApps();
      render();
    }
    let n = 0;
    appsTimer = setInterval(async () => {
      if (S.step !== 1 || ++n > 40) return clearInterval(appsTimer);
      await loadApps(); await refreshSetup(); if (S.step === 1) renderAppsList();
    }, 3000);
  }
  async function loadApps() {
    const res = await fetch('/api/admin/apps', { credentials: 'same-origin' });
    S.apps = res.ok ? await res.json() : [];
    return S.apps;
  }
  const badge = (c) => `<span class="badge" style="--c:var(--c-${c.category});--b:var(--b-${c.category})">${esc(c.channelLabel)}: ${esc(c.label)} <small>${esc(c.version || '')}</small></span>`;
  function appsListHtml() {
    const q = S.filter.toLowerCase();
    const syncing = S.discovering > 0 || S.setup.accounts.some((a) => a.polling);
    let html = syncing ? `<div class="syncing"><span class="spin"></span>${S.discovering > 0 ? 'Fetching apps from your accounts…' : 'Reading the current review status of every app…'}</div>` : '';
    for (const acc of S.setup.accounts) {
      const list = S.apps.filter((a) => a.accountId === acc.id && (!q || `${a.name} ${a.bundleOrPackage}`.toLowerCase().includes(q)));
      const tracked = S.apps.filter((a) => a.accountId === acc.id && a.tracked).length;
      html += `<div class="group"><div class="gh">${storeIc(acc.store)}<b>${esc(acc.name)}</b><span>${tracked} of ${S.apps.filter((a) => a.accountId === acc.id).length} watched</span><div class="grow"></div>
        <button class="btn ghost sm" data-all="${esc(acc.id)}">Select all</button><button class="btn ghost sm" data-none="${esc(acc.id)}">None</button></div>
        <div class="list">${!list.length ? (S.discovering > 0 ? '<div class="skel"></div><div class="skel"></div><div class="skel"></div>' : `<div style="padding:22px;color:var(--muted);text-align:center">${acc.error ? esc(acc.error) : q ? 'No apps match your search.' : 'No apps found in this account yet.'}</div>`)
          : list.map((a) => `<div class="row ${a.tracked ? '' : 'off'}">
            <button class="check ${a.tracked ? 'on' : ''}" data-track="${esc(a.uuid)}" aria-label="Watch ${esc(a.name)}">${a.tracked ? ic('check', 'sm') : ''}</button>
            <div style="display:flex;gap:12px;align-items:center;min-width:0">${appIcon(a.name, a.iconUrl)}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sb">${esc(a.bundleOrPackage)}</div></div></div>
            <div class="chans">${a.channels.length ? a.channels.slice(0, 2).map(badge).join('') : `<span class="badge" style="--c:var(--c-none);--b:var(--b-none)">${syncing ? 'Checking status…' : 'No submissions yet'}</span>`}</div>
            <div class="toggles"><button class="tg ${a.notify && a.tracked ? 'on' : ''}" data-notify="${esc(a.uuid)}" ${a.tracked ? '' : 'disabled'} title="Post this app's changes to Google Chat">${ic(a.notify ? 'bell' : 'bell-off')}<span>${a.notify ? 'Notify' : 'Muted'}</span></button></div>
          </div>`).join('')}</div></div>`;
    }
    return html;
  }
  function vApps() {
    const total = S.apps.length, tracked = S.apps.filter((a) => a.tracked).length;
    return `
      <div class="eyebrow">Step 2 of 4</div>
      <h1>Choose the apps to watch</h1>
      <p class="lead">These are all the apps your connected accounts can see. Everything is watched by default — untick apps you don't care about, or keep them on the dashboard but mute their Chat messages.</p>
      <div class="toolbar"><div class="search">${ic('search')}<input type="text" id="appq" placeholder="Search ${total} apps…" value="${esc(S.filter)}"></div><span class="pill ${tracked ? 'ok' : 'warn'}">${tracked} watched</span></div>
      <div id="appsList">${appsListHtml()}</div>
      <div class="actions"><button class="btn ghost" data-go="0">${ic('back')}Back</button><div class="grow"></div><button class="btn primary" data-go="2" ${tracked ? '' : 'disabled'}>Continue ${ic('arrow')}</button></div>`;
  }
  function renderAppsList() { const el = $('#appsList'); if (el) el.innerHTML = appsListHtml(); const p = $('.toolbar .pill'); if (p) { const t = S.apps.filter((a) => a.tracked).length; p.textContent = `${t} watched`; } const c = $('[data-go="2"]'); if (c) c.disabled = !S.apps.some((a) => a.tracked); }
  async function patchApp(uuid, body) {
    const a = S.apps.find((x) => x.uuid === uuid);
    Object.assign(a, body);
    renderAppsList();
    const r = await api(`/apps/${uuid}`, { method: 'PATCH', body });
    if (!r.ok) toast(r.error || 'Could not save');
  }
  async function bulk(accountId, tracked) {
    const ids = S.apps.filter((a) => a.accountId === accountId).map((a) => a.uuid);
    S.apps.forEach((a) => { if (a.accountId === accountId) a.tracked = tracked; });
    renderAppsList();
    await api('/apps/bulk', { method: 'POST', body: { uuids: ids, tracked } });
  }

  // ── step 3: chat ──
  function vChat() {
    const c = S.setup.chat;
    if (c.locked) return `
      <div class="eyebrow">Step 3 of 4</div>
      <h1>Google Chat is ready</h1>
      <p class="lead">Updates go to the space set in the server's <code>.env</code> (<code>GOOGLE_CHAT_SPACE</code>). Every message starts with <b>🤖 app_review_bot</b>.</p>
      <div class="card pad">
        <div class="acc" style="border:0;padding:0 0 14px"><span class="ic">💬</span><div class="grow"><b>${esc(c.masked)}</b><span>Fixed in .env · not editable here</span></div><span class="pill ok">Locked</span></div>
        <div class="acc" style="border:0;padding:0"><span class="ic">👤</span><div class="grow"><b>${c.userEmail ? esc(c.userEmail) : 'Not signed in'}</b><span>${c.userEmail ? 'Messages are sent from this account' : 'Sign in once so messages can be sent'}</span></div>
          <a class="btn sm" href="/api/admin/chat/user/connect">${c.userEmail ? 'Switch account' : 'Sign in with Google'}</a></div>
        <div class="actions"><button class="btn primary" id="sendTest" ${c.userEmail ? '' : 'disabled'}>${ic('send')}Send test message</button></div>
        ${S.chatResult ? `<div class="result ${S.chatResult.ok ? 'ok' : 'bad'}">${ic(S.chatResult.ok ? 'check' : 'x')}${esc(S.chatResult.msg)}</div>` : ''}
      </div>
      <div class="actions"><button class="btn ghost" data-go="1">${ic('back')}Back</button><div class="grow"></div><button class="btn primary" id="toDone">Continue ${ic('arrow')}</button></div>`;
    const p = S.prefs;
    const first = S.apps.find((a) => a.tracked && a.channels.length) || S.apps.find((a) => a.tracked) || { name: 'Troopool' };
    return `
      <div class="eyebrow">Step 3 of 4</div>
      <h1>Connect app_review_bot to Google Chat</h1>
      <p class="lead">Create an incoming webhook in the Chat space where your team wants review updates. Name it <b>app_review_bot</b> — that's the name the messages will show.</p>
      <div class="split">
        <div class="card pad">
          <ol class="guide">
            <li><div>Open the Google Chat space → click the space name → <b>Apps &amp; integrations</b>.</div></li>
            <li><div><b>Webhooks</b> → <b>Add webhook</b>. Name:<br><button class="copy" data-copy="app_review_bot">app_review_bot ${ic('copy')}</button></div></li>
            <li><div>Avatar URL is optional. Click <b>Save</b>, then copy the webhook URL.</div></li>
            <li style="padding-bottom:4px"><div style="flex:1;min-width:0"><b>Paste it here</b>
              <input type="url" class="mono" id="chatUrl" style="margin-top:8px" placeholder="${c.configured ? esc(c.masked) : 'https://chat.googleapis.com/v1/spaces/…/messages?key=…&token=…'}" value="${esc(S.chatUrl)}" autocomplete="off"></div></li>
          </ol>
          <div class="actions" style="margin-top:14px">
            <button class="btn primary" id="sendTest">${ic('send')}Save &amp; send test message</button>
            ${c.configured ? '<span class="pill ok">Connected</span>' : ''}
          </div>
          ${S.chatResult ? `<div class="result ${S.chatResult.ok ? 'ok' : 'bad'}">${ic(S.chatResult.ok ? 'check' : 'x')}${esc(S.chatResult.msg)}</div>` : ''}
          <div class="prefs">
            <div class="field"><label for="p-sla">Flag as stuck after</label><select id="p-sla">${[24, 36, 48, 72, 96].map((h) => `<option value="${h}" ${Number(p.stuckHours || 48) === h ? 'selected' : ''}>${h} hours</option>`).join('')}</select></div>
          </div>
        </div>
        <div class="preview">
          <div class="ttl">Preview in Google Chat</div>
          <div class="msg"><span class="av"><i></i></span><div style="min-width:0;flex:1">
            <div class="who">app_review_bot <em>App</em> <span>now</span></div>
            <div class="gcard"><div class="hd">${appIcon(first.name, first.iconUrl)}<div><b>🔍 ${esc(first.name)}</b><span>App Store Connect · App Store</span></div></div>
              <div class="kv"><div><small>Status</small>📤 Sent for review → <b>🔍 In review</b></div><div><small>Version</small>3.4.0</div><div><small>Since submission</small>5h 12m</div><div><small>Account</small>${esc(S.setup.accounts[0]?.name || 'WebMob Technologies')}</div></div>
              <div class="bt"><span>Open App Store Connect</span></div></div>
            <div class="gcard" style="margin-top:8px"><div class="hd">${appIcon(first.name, first.iconUrl)}<div><b>❌ ${esc(first.name)}</b><span>Google Play · Production</span></div></div>
              <div class="kv"><div><small>Status</small><b>❌ Rejected</b></div><div><small>Reason</small>Issue found: Data safety form does not match the app.</div></div></div>
          </div></div>
        </div>
      </div>
      <div class="actions"><button class="btn ghost" data-go="1">${ic('back')}Back</button><div class="grow"></div>
        ${c.configured ? '' : '<button class="btn ghost" id="skipChat">Skip for now</button>'}
        <button class="btn primary" id="toDone" ${c.configured ? '' : 'disabled'}>Continue ${ic('arrow')}</button></div>`;
  }
  async function sendTest() {
    const url = $('#chatUrl')?.value.trim() || '';
    S.chatUrl = url;
    const b = $('#sendTest');
    b.disabled = true; b.innerHTML = '<span class="spin"></span>Sending…';
    if (url) {
      const r = await api('/settings/chat', { method: 'PUT', body: { webhookUrl: url } });
      if (!r.ok) { S.chatResult = { ok: false, msg: r.error }; return render(); }
    }
    const t = await api('/settings/chat/test', { method: 'POST', body: {} });
    S.chatResult = t.ok ? { ok: true, msg: 'Test message sent — check the Chat space for app_review_bot’s hello.' } : { ok: false, msg: t.error || 'Google Chat rejected the message' };
    await refreshSetup();
    render();
  }
  async function savePrefs(patch) {
    Object.assign(S.prefs, patch);
    await api('/settings/prefs', { method: 'PUT', body: patch });
  }

  // ── step 4: done ──
  function vDone() {
    const s = S.setup;
    const tracked = s.apps.tracked;
    const syncing = s.accounts.some((a) => a.polling);
    return `<div class="card hero">
      <div class="burst">${ic('rocket', 'lg')}</div>
      <h1>You're all set</h1>
      <p class="lead" style="margin:0 auto;max-width:520px">app_review_bot is now watching your apps. Every store update is posted to Google Chat within about ${Math.max(s.prefs.applePollMinutes || 1, s.prefs.gmailPollMinutes || 1)} minute of happening.</p>
      <div class="summary">
        <div class="sum"><b>${s.accounts.length}</b><span>account${s.accounts.length === 1 ? '' : 's'} connected</span></div>
        <div class="sum"><b>${tracked}</b><span>apps watched</span></div>
        <div class="sum"><b>${s.chat.configured ? 'On' : 'Off'}</b><span>Google Chat bot</span></div>
      </div>
      <div class="tasks">
        ${s.accounts.map((a) => `<div class="task">${a.error ? `<span class="pill bad">Error</span>` : a.polling ? '<span class="pill run">Syncing</span>' : '<span class="pill ok">Synced</span>'}<span>${esc(a.name)} · ${a.store === 'apple' ? 'App Store Connect' : 'Google Play'}${a.error ? ` — ${esc(a.error)}` : ''}</span></div>`).join('')}
        ${s.accounts.some((a) => a.store === 'google') && !s.gmail.enabled ? '<div class="task"><span class="pill warn">Later</span><span>Play approvals &amp; rejection reasons need Gmail — connect it in 2 clicks from Admin → Setup → Play email reader.</span></div>' : ''}
        ${!s.chat.configured ? '<div class="task"><span class="pill warn">Later</span><span>Google Chat not connected — the dashboard works, but nobody gets pinged.</span></div>' : ''}
        <div class="task"><span class="pill ok">Quiet start</span><span>Current statuses are recorded silently, so the space isn't flooded. Only new changes are posted.</span></div>
      </div>
      <div class="actions" style="justify-content:center"><button class="btn ghost" data-go="2">${ic('back')}Back</button><button class="btn primary" id="finish">${syncing ? '<span class="spin"></span>' : ''}Open dashboard ${ic('arrow')}</button></div>
    </div>`;
  }

  // ── render + events ──
  function render(keep) {
    renderRail();
    const v = [vAccounts, vApps, vChat, vDone][S.step];
    $('#main').innerHTML = S.setup ? v() : '<div style="padding:60px;color:var(--muted)"><span class="spin" style="display:inline-block;vertical-align:-3px;margin-right:8px"></span>Loading…</div>';
    if (keep) { if ($('#f-issuer') && keep.issuer) $('#f-issuer').value = keep.issuer; if ($('#f-key') && keep.key) $('#f-key').value = keep.key; if ($('#f-dev') && keep.dev) $('#f-dev').value = keep.dev; }
  }

  document.addEventListener('click', async (e) => {
    const t = e.target;
    const ch = t.closest('.choice'); if (ch) { if (S.store !== ch.dataset.store) { S.store = ch.dataset.store; S.file = null; S.fileName = ''; S.checks = null; render(); } return; }
    if (t.closest('#drop')) return $('#file').click();
    if (t.closest('#verify')) return verify();
    const g = t.closest('[data-go]'); if (g) return go(Number(g.dataset.go));
    const rm = t.closest('[data-remove]');
    if (rm) {
      const a = S.setup.accounts.find((x) => x.id === rm.dataset.remove);
      if (!confirm(`Remove ${a.name}? Its apps and history will be deleted.`)) return;
      await api(`/accounts/${a.id}`, { method: 'DELETE' });
      S.discovered.delete(a.id);
      await refreshSetup(); return render();
    }
    const tr = t.closest('[data-track]'); if (tr) { const a = S.apps.find((x) => x.uuid === tr.dataset.track); return patchApp(a.uuid, { tracked: !a.tracked }); }
    const nt = t.closest('[data-notify]'); if (nt) { const a = S.apps.find((x) => x.uuid === nt.dataset.notify); return patchApp(a.uuid, { notify: !a.notify }); }
    const all = t.closest('[data-all]'); if (all) return bulk(all.dataset.all, true);
    const none = t.closest('[data-none]'); if (none) return bulk(none.dataset.none, false);
    const cp = t.closest('[data-copy]'); if (cp) return copy(cp.dataset.copy);
    if (t.closest('#sendTest')) return sendTest();
    if (t.closest('#p-digest')) { await savePrefs({ digestEnabled: S.prefs.digestEnabled === false }); return render(); }
    if (t.closest('#skipChat') || t.closest('#toDone')) { await refreshSetup(); return go(3); }
    if (t.closest('#finish')) { await api('/onboarding/complete', { method: 'POST' }); location.href = '/dashboard'; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'file') readFile(e.target.files[0]);
    if (e.target.id === 'p-sla') savePrefs({ stuckHours: Number(e.target.value) });
    if (e.target.id === 'p-time') savePrefs({ digestTime: e.target.value });
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'appq') { S.filter = e.target.value; renderAppsList(); } if (e.target.id === 'chatUrl') S.chatUrl = e.target.value; });
  document.addEventListener('dragover', (e) => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest?.('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); readFile(e.dataTransfer.files[0]); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest?.('#drop')) $('#file').click(); });

  async function refreshSetup() {
    S.setup = await api('/setup');
    S.prefs = { ...S.setup.prefs };
  }

  (async () => {
    render();
    await refreshSetup();
    const s = S.setup;
    S.step = location.hash === '#add' || !s.accounts.length ? 0 : !s.apps.total ? 1 : !s.chat.configured ? 2 : 3;
    if (S.step === 1) startApps(); else { await loadApps(); }
    render();
  })();
})();
</script>
</body>
</html>
